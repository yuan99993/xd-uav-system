# Fixed-wing terrain planner contract. All distances are metres.
minimum_clearance_m: 50.0
maximum_clearance_m: 120.0
safety_margin_m: 1.0

# Subtracted from GeoTIFF elevations before safety surfaces are generated.
# Keep zero when task Z and the DEM already use the same vertical datum.
terrain_elevation_offset_m: 0.0

minimum_turning_radius_m: 66.66667
maximum_climb_angle_rad: 0.15
solve_time_per_leg_s: 5.0
# Generic launches retain one bounded attempt. The interactive swarm vehicle
# launch explicitly selects a larger budget without weakening flight limits.
maximum_solve_attempts: 1

request_timeout_s: 2.0
future_tolerance_s: 0.05
maximum_request_points: 64
minimum_request_segment_m: 1.0

validation_sample_step_m: 1.0
maximum_sample_gap_m: 10.0
endpoint_tolerance_m: 0.01
surface_tolerance_m: 0.001
maximum_output_points: 10000
minimum_output_spacing_m: 0.05

# Zero preserves OMPL's normal nondeterministic production seeding. Tests and
# reproducible investigations may set a positive fixed seed.
random_seed: 0
