# do not modify these
root: ./
name: four_multi_px4
socket_name: xd_uav
attach: false

# Four PX4 SITL multirotors: uav1, uav2, uav3 and uav4.
pre_window: source /opt/ros/noetic/setup.bash; source "${CATKIN_WORKSPACE}/devel/setup.bash"; export ROS_PACKAGE_PATH="${PX4_AUTOPILOT_ROOT}:${PX4_AUTOPILOT_ROOT}/Tools/sitl_gazebo:${ROS_PACKAGE_PATH:-}"; export GAZEBO_PLUGIN_PATH="${PX4_AUTOPILOT_ROOT}/build/px4_sitl_default/build_gazebo:${GAZEBO_PLUGIN_PATH:-}"; export GAZEBO_MODEL_PATH="${PX4_AUTOPILOT_ROOT}/Tools/sitl_gazebo/models:${GAZEBO_MODEL_PATH:-}"; export LD_LIBRARY_PATH="${PX4_AUTOPILOT_ROOT}/build/px4_sitl_default/build_gazebo:/usr/lib/x86_64-linux-gnu/gazebo-11/plugins:${LD_LIBRARY_PATH:-}"; export ROS_MASTER_URI=http://localhost:11311; export ROS_HOSTNAME=localhost; export DISPLAY=${DISPLAY:-:0}; unset LIBGL_ALWAYS_SOFTWARE; wait_for_ros() { until rosnode list >/dev/null 2>&1; do sleep 0.2; done; }; wait_for_sim_time() { until rostopic echo -n1 /clock >/dev/null 2>&1; do sleep 0.2; done; };
startup_window: estimator

windows:
  - roscore:
      layout: tiled
      panes:
        - roscore

  - px4_sitl:
      layout: tiled
      panes:
        - wait_for_ros; roslaunch px4 mavros_posix_sitl_4multi_ns.launch

  - estimator:
      layout: tiled
      panes:
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_state_estimators uav_localization_stack.launch UAV_NAME:=uav1 tf_config:=${XD_UAV_REPO_ROOT}/src/xd_uav_single_tf_manager/config/multirotor_single_tf.yaml
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_state_estimators uav_localization_stack.launch UAV_NAME:=uav2 tf_config:=${XD_UAV_REPO_ROOT}/src/xd_uav_single_tf_manager/config/multirotor_single_tf.yaml
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_state_estimators uav_localization_stack.launch UAV_NAME:=uav3 tf_config:=${XD_UAV_REPO_ROOT}/src/xd_uav_single_tf_manager/config/multirotor_single_tf.yaml
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_state_estimators uav_localization_stack.launch UAV_NAME:=uav4 tf_config:=${XD_UAV_REPO_ROOT}/src/xd_uav_single_tf_manager/config/multirotor_single_tf.yaml
  - contoller:
      layout: tiled
      panes:
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_control_manager multirotor_system.launch UAV_NAME:=uav1
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_control_manager multirotor_system.launch UAV_NAME:=uav2
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_control_manager multirotor_system.launch UAV_NAME:=uav3
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_control_manager multirotor_system.launch UAV_NAME:=uav4
  - world_tf_manager:
      layout: tiled
      panes:
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_world_tf_manager world_tf.launch
  - planning:
      layout: tiled
      panes:
        - wait_for_sim_time; roslaunch xd_uav_planning planning.launch UAV_NAME:=uav1 vehicle_type:=multirotor common_frame:=world output_frame:=uav1/odom ego_id:=0
        - wait_for_sim_time; roslaunch xd_uav_planning planning.launch UAV_NAME:=uav2 vehicle_type:=multirotor common_frame:=world output_frame:=uav2/odom ego_id:=1
        - wait_for_sim_time; roslaunch xd_uav_planning planning.launch UAV_NAME:=uav3 vehicle_type:=multirotor common_frame:=world output_frame:=uav3/odom ego_id:=2
        - wait_for_sim_time; roslaunch xd_uav_planning planning.launch UAV_NAME:=uav4 vehicle_type:=multirotor common_frame:=world output_frame:=uav4/odom ego_id:=3
  - yolo_red:
      layout: tiled
      panes:
        - >-
          wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1;
          roslaunch sar_yolo_detector xd_smart_tracker_integration.launch UAV_NAME:=uav1 input_image_topic:=camera/image_raw camera_info_topic:=camera/camera_info output_detections_topic:=detect/input/detections_2d image_source:=fixed_rgb sensor_id:=fixed_camera use_gpu:=false python_executable:=${SAR_PYTHON_EXECUTABLE} &
          detector_pid=$!;
          until rosservice info /uav1/sar_yolo_smart_tracker_fixed/switch_tracking_mode >/dev/null 2>&1; do kill -0 "$detector_pid" 2>/dev/null || exit 1; sleep 0.2; done;
          rosservice call /uav1/sar_yolo_smart_tracker_fixed/switch_tracking_mode "{mode: 'color_tracker', color_name: 'red'}";
          wait "$detector_pid"
        - >-
          wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1;
          roslaunch sar_yolo_detector xd_smart_tracker_integration.launch UAV_NAME:=uav2 input_image_topic:=camera/image_raw camera_info_topic:=camera/camera_info output_detections_topic:=detect/input/detections_2d image_source:=fixed_rgb sensor_id:=fixed_camera use_gpu:=false python_executable:=${SAR_PYTHON_EXECUTABLE} &
          detector_pid=$!;
          until rosservice info /uav1/sar_yolo_smart_tracker_fixed/switch_tracking_mode >/dev/null 2>&1; do kill -0 "$detector_pid" 2>/dev/null || exit 1; sleep 0.2; done;
          rosservice call /uav2/sar_yolo_smart_tracker_fixed/switch_tracking_mode "{mode: 'color_tracker', color_name: 'red'}";
          wait "$detector_pid"
        - >-
          wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1;
          roslaunch sar_yolo_detector xd_smart_tracker_integration.launch UAV_NAME:=uav3 input_image_topic:=camera/image_raw camera_info_topic:=camera/camera_info output_detections_topic:=detect/detections image_source:=fixed_rgb sensor_id:=fixed_camera use_gpu:=false python_executable:=${SAR_PYTHON_EXECUTABLE} &
          detector_pid=$!;
          until rosservice info /uav1/sar_yolo_smart_tracker_fixed/switch_tracking_mode >/dev/null 2>&1; do kill -0 "$detector_pid" 2>/dev/null || exit 1; sleep 0.2; done;
          rosservice call /uav3/sar_yolo_smart_tracker_fixed/switch_tracking_mode "{mode: 'color_tracker', color_name: 'red'}";
          wait "$detector_pid"
        - >-
          wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1;
          roslaunch sar_yolo_detector xd_smart_tracker_integration.launch UAV_NAME:=uav4 input_image_topic:=camera/image_raw camera_info_topic:=camera/camera_info output_detections_topic:=detect/detections image_source:=fixed_rgb sensor_id:=fixed_camera use_gpu:=false python_executable:=${SAR_PYTHON_EXECUTABLE} &
          detector_pid=$!;
          until rosservice info /uav1/sar_yolo_smart_tracker_fixed/switch_tracking_mode >/dev/null 2>&1; do kill -0 "$detector_pid" 2>/dev/null || exit 1; sleep 0.2; done;
          rosservice call /uav4/sar_yolo_smart_tracker_fixed/switch_tracking_mode "{mode: 'color_tracker', color_name: 'red'}";
          wait "$detector_pid"
  - task_allocator:
      layout: tiled
      panes:
        - >-
          wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1;
          roslaunch xd_uav_task_allocate task_allocate.launch
          mission_config:=$(rospack find xd_uav_task_allocate)/config/mission.yaml
          scout_config:=$(rospack find xd_uav_task_allocate)/config/scouts_two_multi.yaml
          worker_config:=$(rospack find xd_uav_task_allocate)/config/workers_two_multi.yaml
          post_arrival_config:=$(rospack find xd_uav_task_allocate)/config/task_execution_four_multi.yaml
  - track_execute:
      layout: tiled
      panes:
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_track track.launch UAV_NAME:=uav3
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_track track.launch UAV_NAME:=uav4
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_task_execute task_execute.launch UAV_NAME:=uav3
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_task_execute task_execute.launch UAV_NAME:=uav4
  - detect:
      layout: tiled
      panes:
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_detect detect.launch UAV_NAME:=uav1 config:=${XD_UAV_REPO_ROOT}/src/xd_uav_detect/config/lidar_camera.yaml
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_detect detect.launch UAV_NAME:=uav2 config:=${XD_UAV_REPO_ROOT}/src/xd_uav_detect/config/lidar_camera.yaml
  - rviz:
      layout: tiled
      panes:
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; rosrun rviz rviz -d rviz_cfg/xd_uav.rviz
  - takeoff:
      layout: tiled
      panes:
        - >-
          history -s 'wait_for_sim_time; rosservice call /uav1/control_manager/takeoff "altitude: 4.0"; rosservice call /uav2/control_manager/takeoff "altitude: 4.0"; rosservice call /uav3/control_manager/takeoff "altitude: 4.0"; rosservice call /uav4/control_manager/takeoff "altitude: 4.0"'
  - land_home:
      layout: tiled
      panes:
        - >-
          history -s 'wait_for_sim_time; rosservice call /uav1/control_manager/land_home; rosservice call /uav2/control_manager/land_home; rosservice call /uav3/control_manager/land_home; rosservice call /uav4/control_manager/land_home'

  # - fastlio:
  #     layout: tiled
  #     panes:
  #       - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch fast_lio mapping_px4_gazebo.launch uav_name:=uav1
  #       - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch fast_lio mapping_px4_gazebo.launch uav_name:=uav2
  #       - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch fast_lio mapping_px4_gazebo.launch uav_name:=uav3
