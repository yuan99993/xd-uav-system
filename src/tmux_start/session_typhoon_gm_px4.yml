# do not modify these
root: ./
name: typhoon_gm_px4
socket_name: xd_uav
attach: false

# One namespaced Typhoon H480 and the complete red-target -> track -> gimbal loop.
pre_window: source /opt/ros/noetic/setup.bash; source "${CATKIN_WORKSPACE}/devel/setup.bash"; export ROS_PACKAGE_PATH="${PX4_AUTOPILOT_ROOT}:${PX4_AUTOPILOT_ROOT}/Tools/sitl_gazebo:${ROS_PACKAGE_PATH:-}"; export GAZEBO_PLUGIN_PATH="${PX4_AUTOPILOT_ROOT}/build/px4_sitl_default/build_gazebo:${GAZEBO_PLUGIN_PATH:-}"; export GAZEBO_MODEL_PATH="${PX4_AUTOPILOT_ROOT}/Tools/sitl_gazebo/models:${GAZEBO_MODEL_PATH:-}"; export LD_LIBRARY_PATH="${PX4_AUTOPILOT_ROOT}/build/px4_sitl_default/build_gazebo:/usr/lib/x86_64-linux-gnu/gazebo-11/plugins:${LD_LIBRARY_PATH:-}"; export ROS_MASTER_URI=http://localhost:11311; export ROS_HOSTNAME=localhost; export DISPLAY=${DISPLAY:-:0}; unset LIBGL_ALWAYS_SOFTWARE; wait_for_ros() { until rosnode list >/dev/null 2>&1; do sleep 0.2; done; }; wait_for_sim_time() { until rostopic echo -n1 /clock >/dev/null 2>&1; do sleep 0.2; done; };
startup_window: closed_loop

windows:
  - roscore:
      layout: tiled
      panes:
        - roscore

  - px4_sitl:
      layout: tiled
      panes:
        # Let the UDP receiver bind before Typhoon starts emitting its H264 stream.
        - wait_for_ros; sleep 3; roslaunch px4 mavros_posix_sitl_typhoon_h480_ns.launch UAV_NAME:=uav1 ID:=0

  - vehicle_stack:
      layout: tiled
      panes:
        - wait_for_sim_time; rostopic echo -n1 /uav1/mavros/imu/data >/dev/null 2>&1; roslaunch xd_uav_state_estimators uav_localization_stack.launch UAV_NAME:=uav1 republish_world:=false tf_config:=${XD_UAV_REPO_ROOT}/src/xd_uav_single_tf_manager/config/multirotor_single_tf.yaml
        - wait_for_sim_time; rostopic echo -n1 /uav1/mavros/imu/data >/dev/null 2>&1; roslaunch xd_uav_control_manager multirotor_system.launch UAV_NAME:=uav1 use_controller_override_config:=true controller_override_config:=${XD_UAV_REPO_ROOT}/src/xd_uav_controller/config/typhoon_h480_override.yaml

  - camera_and_target:
      layout: tiled
      panes:
        - wait_for_ros; /usr/bin/python3 ${XD_UAV_REPO_ROOT}/src/add_red_box_scripts/gazebo_udp_video_to_ros_image.py --udp-port 5600 --topic /uav1/cgo3_camera/image_raw --frame-id uav1/cgo3_camera_link --width 640 --height 360 --fps 10
        #- wait_for_sim_time; /usr/bin/python3 ${XD_UAV_REPO_ROOT}/src/add_red_box_scripts/spawn_red_boxes.py --position=12,-5,1 --size 2 2 2 --ground-z 0 --replace --prefix typhoon_target

  - closed_loop:
      layout: tiled
      panes:
        # Red detector publishes directly to xd_uav_track's 2D input.
        - wait_for_sim_time; /usr/bin/python3 ${XD_UAV_REPO_ROOT}/src/add_red_box_scripts/red_box_detector.py --uavs uav1 --image-topic uav1=/uav1/cgo3_camera/image_raw --detections-template '/{uav}/detect/detections'
        - wait_for_sim_time; roslaunch xd_uav_track track.launch UAV_NAME:=uav1
        - wait_for_sim_time; roslaunch gm_control xd_track_gimbal_control.launch UAV_NAME:=uav1 image_topic:=/uav1/cgo3_camera/image_raw
        - wait_for_sim_time; /usr/bin/python3 ${XD_UAV_REPO_ROOT}/src/add_red_box_scripts/gm_control_to_gazebo_typhoon_gimbal.py --command-topic /uav1/gm_control/gimbal_cmd --state-topic /uav1/gm_control/gimbal_state --gimbal-port 13280 --frame-id uav1/cgo3_gimbal --yaw-sign -1 --pitch-sign 1 --rate 50

  - observe:
      layout: tiled
      panes:
        - wait_for_sim_time; rostopic echo /uav1/track/status
        - wait_for_sim_time; rostopic echo /uav1/gm_control/gimbal_state
        - wait_for_sim_time; rosrun rqt_image_view rqt_image_view /uav1/gm_control/debug_image

  # Tracking is armed manually so opening the session cannot move the aircraft.
  - enable_tracking:
      layout: tiled
      panes:
        - >-
          history -s 'rosservice call /uav1/track/set_profile "profile: gm_velocity_vector"; rosservice call /uav1/track/start_tracker "start: true"'

  - takeoff:
      layout: tiled
      panes:
        - >-
          history -s 'rosservice call /uav1/control_manager/takeoff "altitude: 6.0"'

  - stop_and_land:
      layout: tiled
      panes:
        - >-
          history -s 'rosservice call /uav1/track/start_tracker "start: false";rosservice call /uav1/control_manager/land_home'
