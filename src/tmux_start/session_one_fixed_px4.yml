# do not modify these
root: ./
name: one_fixed_px4
socket_name: xd_uav
attach: false

# One namespaced PX4 fixed-wing SITL with a nadir camera and the complete
# red-target -> 2D detection -> ground projection -> fixed-wing tracking loop.
pre_window: source /opt/ros/noetic/setup.bash; source "${CATKIN_WORKSPACE}/devel/setup.bash"; export ROS_PACKAGE_PATH="${PX4_AUTOPILOT_ROOT}:${PX4_AUTOPILOT_ROOT}/Tools/sitl_gazebo:${ROS_PACKAGE_PATH:-}"; export GAZEBO_PLUGIN_PATH="${PX4_AUTOPILOT_ROOT}/build/px4_sitl_default/build_gazebo:${GAZEBO_PLUGIN_PATH:-}"; export GAZEBO_MODEL_PATH="${PX4_AUTOPILOT_ROOT}/Tools/sitl_gazebo/models:${GAZEBO_MODEL_PATH:-}"; export LD_LIBRARY_PATH="${PX4_AUTOPILOT_ROOT}/build/px4_sitl_default/build_gazebo:/usr/lib/x86_64-linux-gnu/gazebo-11/plugins:${LD_LIBRARY_PATH:-}"; export ROS_MASTER_URI=http://localhost:11311; export ROS_HOSTNAME=localhost; export DISPLAY=${DISPLAY:-:0}; unset LIBGL_ALWAYS_SOFTWARE; wait_for_ros() { until rosnode list >/dev/null 2>&1; do sleep 0.2; done; }; wait_for_sim_time() { until rostopic echo -n1 /clock >/dev/null 2>&1; do sleep 0.2; done; };
startup_window: observe

windows:
  - roscore:
      layout: tiled
      panes:
        - roscore

  - px4_sitl:
      layout: tiled
      panes:
        - wait_for_ros; roslaunch px4 mavros_posix_sitl_fixedwing_ns.launch uav_name:=uav1 ID:=0

  - vehicle_stack:
      layout: tiled
      panes:
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_state_estimators uav_localization_stack.launch UAV_NAME:=uav1 tf_config:=${XD_UAV_REPO_ROOT}/src/xd_uav_single_tf_manager/config/fixedwing_single_tf.yaml
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_control_manager fixedwing_system.launch UAV_NAME:=uav1

  - target_and_detector:
      layout: tiled
      panes:
        # One large, deterministic ground target is easier than YOLO for the
        # first closed-loop sign and interface test.
        - wait_for_sim_time; /usr/bin/python3 ${XD_UAV_REPO_ROOT}/src/add_red_box_scripts/spawn_red_boxes.py --position=80,0,0.1 --size 10 10 0.2 --ground-z 0 --replace --prefix fixedwing_target
        - wait_for_sim_time; /usr/bin/python3 ${XD_UAV_REPO_ROOT}/src/add_red_box_scripts/red_box_detector.py --uavs uav1 --image-topic uav1=/uav1/down_camera/image_raw

  - detect_and_track:
      layout: tiled
      panes:
        - wait_for_sim_time; roslaunch xd_uav_detect detect.launch UAV_NAME:=uav1 config:=${XD_UAV_REPO_ROOT}/src/xd_uav_detect/config/camera_ground_plane.yaml image_topic:=down_camera/image_raw camera_info_topic:=down_camera/camera_info
        - >-
          wait_for_sim_time;
          rosparam load ${XD_UAV_REPO_ROOT}/src/xd_uav_track/config/track.yaml /uav1/track;
          rosparam set /uav1/track/follower/profile fw_velocity_vector;
          rosparam set /uav1/track/follower/enable_vertical_control false;
          rosparam set /uav1/track/frames/body uav1/base_link;
          rosrun xd_uav_track xd_uav_track_node __ns:=/uav1 __name:=track

  - observe:
      layout: tiled
      panes:
        - wait_for_sim_time; rostopic echo /uav1/track/status
        - wait_for_sim_time; rostopic echo /uav1/control/reference/setpoint
        - wait_for_sim_time; rosrun rqt_image_view rqt_image_view /uav1/track/red_detector/debug_image
        - wait_for_sim_time; rosrun rqt_image_view rqt_image_view /uav1/detect/debug/image

  # Take off first and confirm the estimator/controller are healthy. Tracking
  # remains stopped until the command in enable_tracking is run manually.
  - takeoff:
      layout: tiled
      panes:
        - >-
          history -s 'wait_for_sim_time; rosservice call /uav1/control_manager/takeoff "altitude: 40.0"'

  - enable_tracking:
      layout: tiled
      panes:
        - >-
          history -s 'rosservice call /uav1/track/set_profile "profile: fw_velocity_vector"; rosservice call /uav1/track/start_tracker "start: true"'

  - stop_and_land:
      layout: tiled
      panes:
        - >-
          history -s 'rosservice call /uav1/track/start_tracker "start: false"; rosservice call /uav1/control_manager/land_home'
