# do not modify these
root: ./
name: one_multirotor_px4
socket_name: mrs
attach: false
tmux_options: -f /etc/ctu-mrs/tmux.conf

# One namespaced PX4 multirotor SITL and the refactored multirotor control stack.
pre_window: source /opt/ros/noetic/setup.bash; source /home/kzy/xd-uavsystem-test/devel/setup.bash; export ROS_PACKAGE_PATH=/home/kzy/PX4-1.13.2/PX4-Autopilot:/home/kzy/PX4-1.13.2/PX4-Autopilot/Tools/sitl_gazebo:$ROS_PACKAGE_PATH; export ROS_MASTER_URI=http://localhost:11311; export ROS_HOSTNAME=localhost; export DISPLAY=${DISPLAY:-:0}; unset LIBGL_ALWAYS_SOFTWARE
startup_window: observe

windows:
  - roscore:
      layout: tiled
      panes:
        - roscore

  - px4_sitl:
      layout: tiled
      panes:
        - >-
          waitForRos;
          roslaunch px4 mavros_posix_sitl_ns.launch
          uav_name:=uav1 ID:=0
          world:=/opt/ros/noetic/share/mavlink_sitl_gazebo/worlds/forest.world
          paused:=true start_gazebo:=true unpause_after_spawn:=true

  - vehicle_stack:
      layout: tiled
      panes:
        - waitForTime; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_state_estimators uav_localization_stack.launch UAV_NAME:=uav1 tf_config:=/home/kzy/xd-uavsystem-test/src/xd_uav_single_tf_manager/config/multirotor_single_tf.yaml
        - waitForTime; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_control_manager multirotor_system.launch UAV_NAME:=uav1

  - world_tf:
      layout: tiled
      panes:
        - waitForTime; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_world_tf_manager world_tf.launch config:=/home/kzy/xd-uavsystem-test/src/xd_uav_world_tf_manager/config/world_single_uav1.yaml

  - planning:
      layout: tiled
      panes:
        - waitForTime; roslaunch xd_uav_planning planning.launch UAV_NAME:=uav1 vehicle_type:=multirotor common_frame:=world output_frame:=uav1/odom ego_id:=0 flight_type:=1
  
  - rviz:
      layout: tiled
      panes:
        - waitForTime; rostopic echo -n1 /clock >/dev/null 2>&1; rosrun rviz rviz -d rviz_cfg/xd_uav.rviz

  - takeoff:
      layout: tiled
      panes:
        - >-
          history -s 'waitForTime; rosservice call /uav1/control_manager/takeoff "altitude: 4.0"'

  - stop_and_land:
      layout: tiled
      panes:
        - >-
          history -s 'rosservice call /uav1/control_manager/land_home'

  - observe:
      layout: tiled
      panes:
        - waitForTime; rostopic echo /uav1/state_estimator/main/frames/world/odom       
  
  - goto:
      layout: tiled
      panes:
        - >-
          history -s 'rostopic pub -1 /uav1/planning/goal geometry_msgs/PoseStamped "{header: {stamp: now, frame_id: 'world'}, pose: {position: {x: 10.0, y: 10.0, z: 3.0}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}}}"'
