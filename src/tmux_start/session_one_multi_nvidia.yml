root: ./
name: one_multirotor_nvidia_functions
socket_name: mrs
attach: false
tmux_options: -f /home/nvidia/xd-uavsystem-test/src/tmux_start/tmux_cfg/tmux.conf

# Functional nodes run on this board and connect to the ROS master on the
# other board. The launcher supplies ROS_MASTER_URI and ROS_IP from the shell.
pre_window: source /opt/ros/noetic/setup.bash; source "$HOME/xd-uavsystem-test/devel/setup.bash"; export ROS_MASTER_URI="${ROS_MASTER_URI:?ROS_MASTER_URI is required}"; export ROS_IP="${ROS_IP:?ROS_IP is required}"; unset ROS_HOSTNAME; export DISPLAY=${DISPLAY:-:0}; source $HOME/xd-uavsystem-test/.venv-sar/bin/activate
startup_window: vehicle_stack

windows:
  - vehicle_stack:
      layout: tiled
      panes:
        - roslaunch xd_uav_state_estimators uav_localization_stack.launch UAV_NAME:=uav1 tf_config:=$(rospack find xd_uav_single_tf_manager)/config/vtol_single_tf.yaml
        - roslaunch xd_uav_control_manager vtol_system.launch UAV_NAME:=uav1
        - roslaunch xd_uav_state_estimators uav_localization_stack.launch UAV_NAME:=uav2 tf_config:=$(rospack find xd_uav_single_tf_manager)/config/vtol_single_tf.yaml
        - roslaunch xd_uav_control_manager vtol_system.launch UAV_NAME:=uav2
        - roslaunch xd_uav_state_estimators uav_localization_stack.launch UAV_NAME:=uav3 tf_config:=$(rospack find xd_uav_single_tf_manager)/config/vtol_single_tf.yaml
        - roslaunch xd_uav_control_manager vtol_system.launch UAV_NAME:=uav3


  - world_tf:
      layout: tiled
      panes:
        - roslaunch xd_uav_world_tf_manager world_tf.launch config:=$(rospack find xd_uav_world_tf_manager)/config/world.yaml

  - task:
      layout: tiled
      panes:
        - roslaunch xd_uav_task_allocate task_allocate.launch mission_config:=$(rospack find xd_uav_task_allocate)/config/mission.yaml scout_config:=$(rospack find xd_uav_task_allocate)/config/scouts_two_fixed.yaml worker_config:=$(rospack find xd_uav_task_allocate)/config/workers_two_fixed.yaml post_arrival_config:=$(rospack find xd_uav_task_allocate)/config/task_execution_four_fixed.yaml

  - transition_to_fw:
      layout: tiled
      panes:
        - >-
          history -s 'rosservice call /uav1/control_manager/set_flight_regime "target_regime: 1"; rosservice call /uav2/control_manager/set_flight_regime "target_regime: 1"; rosservice call /uav3/control_manager/set_flight_regime "target_regime: 1";'

  - yolo:
      layout: tiled
      panes:
        - roslaunch sar_yolo_detector xd_smart_tracker_fusion_integration.launch   UAV_NAME:=uav1   instance_name:=smart   tracking_mode:=FusionTracker   input_image_topic:=/Sim/SceneBasicDrone/robots/Drone1/sensors/DownCamera/scene_camera/image   camera_info_topic:=/Sim/SceneBasicDrone/robots/Drone1/sensors/DownCamera/scene_camera/camera_info   image_width:=1280   image_height:=720   bridge_input_topic:=sar_yolo_detector/smart/selected_tracked_detections   bridge_input_type:=tracked   output_detections_topic:=track/selected_detections   detect_bridge_enabled:=true   detect_output_detections_topic:=detect/input/detections_2d   model_path:=/home/nvidia/xd-uavsystem-test/src/sar_yolo_detector/models/xd_vehicle_train7/xd_vehicle_train7_tegra_512.engine   model_sha256:=471011311fa9fa6a4067c9cae2fb7e29215fb32956c36a3ea3112c06e75b784e   python_executable:=/home/nvidia/xd-uavsystem-test/.venv-sar/bin/python
        - waitForTime; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_detect detect.launch UAV_NAME:=uav1 config:=/home/nvidia/xd-uavsystem-test/src/xd_uav_detect/config/camera_ground_plane.yaml body_frame:=uav1/base_link world_frame:=world image_topic:=/Sim/SceneBasicDrone/robots/Drone1/sensors/DownCamera/scene_camera/image camera_info_topic:=/Sim/SceneBasicDrone/robots/Drone1/sensors/DownCamera/scene_camera/camera_info

  - track:
      layout: tiled
      panes:
        - roslaunch xd_uav_track track.launch UAV_NAME:=uav1
  
  - gimbal:
      layout: tiled
      panes:
        - history -s 'python3 /home/nvidia/image_compress/gimbal_control_original.py   _uav_name:=uav1   _mode:=tracking   _stabilize:=true   _detection_topic:=/uav1/sar_yolo_detector/smart/selected_tracked_detections   _image_width:=1280   _image_height:=720   _fov_x_deg:=45   _kp_yaw:=0.05   _kp_pitch:=0.02   _ki_yaw:=0.05   _ki_pitch:=0.03   _ff_alpha:=0.0   _max_slew_yaw:=15   _max_slew_pitch:=8   _filter_alpha:=0.3   _deadzone_px:=8'

  - stop_and_land:
      layout: tiled
      panes:
        - history -s 'rosservice call /uav1/control_manager/land_home'

  - takeoff:
      layout: tiled
      panes:
        - >-
          history -s 'rosservice call /uav1/control_manager/takeoff "altitude: 4.0"'
  
  - observe:
      layout: tiled
      panes:
        - waitForTime; rostopic echo /uav1/state_estimator/main/frames/world/odom

  - goto:
      layout: tiled
      panes:
        - >-
          history -s 'rostopic pub -1 /uav1/control/reference/setpoint mavros_msgs/PositionTarget "{header: {stamp: now, frame_id: 'world'}, coordinate_frame: 1, type_mask: 2552, position: {x: 10.0, y: 10.0, z: 3.0}, velocity: {x: 0.0, y: 0.0, z: 0.0}, acceleration_or_force: {x: 0.0, y: 0.0, z: 0.0}, yaw: 0.0, yaw_rate: 0.0}"'
