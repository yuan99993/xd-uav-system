        # - roslaunch xd_uav_control_manager vtol_system.launch UAV_NAME:=uav30

  - world_tf:
      layout: tiled
      panes:
        - roslaunch xd_uav_world_tf_manager world_tf.launch config:=$(rospack find xd_uav_world_tf_manager)/config/30world.yaml

  - formation:
      layout: tiled
      panes:
        - roslaunch xd_uav_formation formation.launch config:=$(rospack find xd_uav_formation)/config/formation_10_fixedwing.yaml
  
  - stop_and_land:
      layout: tiled
      panes:
        - history -s 'rosservice call /uav1/control_manager/land_home'
        - >-
          history -s 'rosservice call /uav1/control_manager/external_control "data: false"'

  - takeoff:
      layout: tiled
      panes:
        - >-
          history -s 'rosservice call /uav1/control_manager/takeoff "altitude: 4.0"'
  
  - observe:
      layout: tiled
      panes:
        - waitForTime; rostopic echo /uav1/state_estimator/main/frames/world/odom

  - goto:
      layout: tiled
      panes:
        - >-
          history -s 'rostopic pub -1 /uav1/control/reference/setpoint mavros_msgs/PositionTarget "{header: {stamp: now, frame_id: 'world'}, coordinate_frame: 1, type_mask: 2552, position: {x: 3000.0, y: 3000.0, z: 130.0}, velocity: {x: 0.0, y: 0.0, z: 0.0}, acceleration_or_force: {x: 0.0, y: 0.0, z: 0.0}, yaw: 0.0, yaw_rate: 0.0}"'
