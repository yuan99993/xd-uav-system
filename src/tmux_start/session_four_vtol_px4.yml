# do not modify these
root: ./
name: four_vtol_task_execute_px4
socket_name: xd_uav
attach: false

# Four Standard VTOLs. uav1/uav2 search; uav3/uav4 approach and execute
# TRACK tasks. The first end-to-end run intentionally keeps every VTOL in
# multicopter mode, so task allocation uses hover route semantics.
pre_window: source /opt/ros/noetic/setup.bash; source "${CATKIN_WORKSPACE}/devel/setup.bash"; export ROS_PACKAGE_PATH="${PX4_AUTOPILOT_ROOT}:${PX4_AUTOPILOT_ROOT}/Tools/sitl_gazebo:${ROS_PACKAGE_PATH:-}"; export GAZEBO_PLUGIN_PATH="${PX4_AUTOPILOT_ROOT}/build/px4_sitl_default/build_gazebo:${GAZEBO_PLUGIN_PATH:-}"; export GAZEBO_MODEL_PATH="${PX4_AUTOPILOT_ROOT}/Tools/sitl_gazebo/models:${GAZEBO_MODEL_PATH:-}"; export LD_LIBRARY_PATH="${PX4_AUTOPILOT_ROOT}/build/px4_sitl_default/build_gazebo:/usr/lib/x86_64-linux-gnu/gazebo-11/plugins:${LD_LIBRARY_PATH:-}"; export ROS_MASTER_URI=http://localhost:11311; export ROS_HOSTNAME=localhost; export DISPLAY=${DISPLAY:-:0}; unset LIBGL_ALWAYS_SOFTWARE; wait_for_ros() { until rosnode list >/dev/null 2>&1; do sleep 0.2; done; }; wait_for_sim_time() { until rostopic echo -n1 /clock >/dev/null 2>&1; do sleep 0.2; done; };
startup_window: estimator

windows:
  - roscore:
      layout: tiled
      panes:
        - roscore

  - px4_sitl:
      layout: tiled
      panes:
        - wait_for_ros; roslaunch px4 4_vtol.launch

  - estimator:
      layout: tiled
      panes:
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_state_estimators uav_localization_stack.launch UAV_NAME:=uav1 tf_config:=${XD_UAV_REPO_ROOT}/src/xd_uav_single_tf_manager/config/vtol_single_tf.yaml
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_state_estimators uav_localization_stack.launch UAV_NAME:=uav2 tf_config:=${XD_UAV_REPO_ROOT}/src/xd_uav_single_tf_manager/config/vtol_single_tf.yaml
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_state_estimators uav_localization_stack.launch UAV_NAME:=uav3 tf_config:=${XD_UAV_REPO_ROOT}/src/xd_uav_single_tf_manager/config/vtol_single_tf.yaml
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_state_estimators uav_localization_stack.launch UAV_NAME:=uav4 tf_config:=${XD_UAV_REPO_ROOT}/src/xd_uav_single_tf_manager/config/vtol_single_tf.yaml

  - controller:
      layout: tiled
      panes:
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_control_manager vtol_system.launch UAV_NAME:=uav1
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_control_manager vtol_system.launch UAV_NAME:=uav2
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_control_manager vtol_system.launch UAV_NAME:=uav3
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_control_manager vtol_system.launch UAV_NAME:=uav4

  - world_tf:
      layout: tiled
      panes:
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_world_tf_manager world_tf.launch

  - localization:
      layout: tiled
      panes:
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_detect detect.launch UAV_NAME:=uav1 config:=${XD_UAV_REPO_ROOT}/src/xd_uav_detect/config/camera_ground_plane.yaml image_topic:=down_camera/image_raw camera_info_topic:=down_camera/camera_info
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_detect detect.launch UAV_NAME:=uav2 config:=${XD_UAV_REPO_ROOT}/src/xd_uav_detect/config/camera_ground_plane.yaml image_topic:=down_camera/image_raw camera_info_topic:=down_camera/camera_info
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_detect detect.launch UAV_NAME:=uav3 config:=${XD_UAV_REPO_ROOT}/src/xd_uav_detect/config/camera_ground_plane.yaml image_topic:=down_camera/image_raw camera_info_topic:=down_camera/camera_info
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_detect detect.launch UAV_NAME:=uav4 config:=${XD_UAV_REPO_ROOT}/src/xd_uav_detect/config/camera_ground_plane.yaml image_topic:=down_camera/image_raw camera_info_topic:=down_camera/camera_info

  - yolo_red:
      layout: tiled
      panes:
        - >-
          wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1;
          roslaunch sar_yolo_detector xd_smart_tracker_integration.launch UAV_NAME:=uav1 input_image_topic:=down_camera/image_raw camera_info_topic:=down_camera/camera_info use_gpu:=true python_executable:=${SAR_PYTHON_EXECUTABLE} &
          detector_pid=$!;
          until rosservice info /uav1/sar_yolo_smart_tracker_fixed/switch_tracking_mode >/dev/null 2>&1; do kill -0 "$detector_pid" 2>/dev/null || exit 1; sleep 0.2; done;
          rosservice call /uav1/sar_yolo_smart_tracker_fixed/switch_tracking_mode "{mode: 'color_tracker', color_name: 'red'}";
          wait "$detector_pid"
        - >-
          wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1;
          roslaunch sar_yolo_detector xd_smart_tracker_integration.launch UAV_NAME:=uav2 input_image_topic:=down_camera/image_raw camera_info_topic:=down_camera/camera_info use_gpu:=true python_executable:=${SAR_PYTHON_EXECUTABLE} &
          detector_pid=$!;
          until rosservice info /uav2/sar_yolo_smart_tracker_fixed/switch_tracking_mode >/dev/null 2>&1; do kill -0 "$detector_pid" 2>/dev/null || exit 1; sleep 0.2; done;
          rosservice call /uav2/sar_yolo_smart_tracker_fixed/switch_tracking_mode "{mode: 'color_tracker', color_name: 'red'}";
          wait "$detector_pid"
        # - >-
        #   wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1;
        #   roslaunch sar_yolo_detector xd_smart_tracker_integration.launch UAV_NAME:=uav3 input_image_topic:=down_camera/image_raw camera_info_topic:=down_camera/camera_info use_gpu:=true python_executable:=${SAR_PYTHON_EXECUTABLE} &
        #   detector_pid=$!;
        #   until rosservice info /uav3/sar_yolo_smart_tracker_fixed/switch_tracking_mode >/dev/null 2>&1; do kill -0 "$detector_pid" 2>/dev/null || exit 1; sleep 0.2; done;
        #   rosservice call /uav3/sar_yolo_smart_tracker_fixed/switch_tracking_mode "{mode: 'color_tracker', color_name: 'red'}";
        #   wait "$detector_pid"
        # - >-
        #   wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1;
        #   roslaunch sar_yolo_detector xd_smart_tracker_integration.launch UAV_NAME:=uav4 input_image_topic:=down_camera/image_raw camera_info_topic:=down_camera/camera_info use_gpu:=true python_executable:=${SAR_PYTHON_EXECUTABLE} &
        #   detector_pid=$!;
        #   until rosservice info /uav4/sar_yolo_smart_tracker_fixed/switch_tracking_mode >/dev/null 2>&1; do kill -0 "$detector_pid" 2>/dev/null || exit 1; sleep 0.2; done;
        #   rosservice call /uav4/sar_yolo_smart_tracker_fixed/switch_tracking_mode "{mode: 'color_tracker', color_name: 'red'}";
        #   wait "$detector_pid"

  - track_execute:
      layout: tiled
      panes:
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_track track_fixedwing_sitl.launch UAV_NAME:=uav3
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_track track_fixedwing_sitl.launch UAV_NAME:=uav4
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_task_execute task_execute.launch UAV_NAME:=uav3
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; roslaunch xd_uav_task_execute task_execute.launch UAV_NAME:=uav4

  - task_allocator:
      layout: tiled
      panes:
        - >-
          wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1;
          roslaunch xd_uav_task_allocate task_allocate.launch
          scout_config:=$(rospack find xd_uav_task_allocate)/config/scouts_two_fixed.yaml
          worker_config:=$(rospack find xd_uav_task_allocate)/config/workers_two_fixed.yaml
          post_arrival_config:=$(rospack find xd_uav_task_allocate)/config/task_execution_vtol.yaml

  - transition_to_fw:
      layout: tiled
      panes:
        - >-
          history -s 'rosservice call /uav1/control_manager/set_flight_regime "target_regime: 1"; rosservice call /uav2/control_manager/set_flight_regime "target_regime: 1"; rosservice call /uav3/control_manager/set_flight_regime "target_regime: 1"; rosservice call /uav4/control_manager/set_flight_regime "target_regime: 1";'

  - transition_to_mr:
      layout: tiled
      panes:
        - >-
          history -s 'rosservice call /uav1/control_manager/set_flight_regime "target_regime: 0"; rosservice call /uav2/control_manager/set_flight_regime "target_regime: 0"; rosservice call /uav3/control_manager/set_flight_regime "target_regime: 0"; rosservice call /uav4/control_manager/set_flight_regime "target_regime: 0"; '

  - rviz:
      layout: tiled
      panes:
        - wait_for_sim_time; rostopic echo -n1 /clock >/dev/null 2>&1; rosrun rviz rviz -d rviz_cfg/xd_uav.rviz

  - takeoff:
      layout: tiled
      panes:
        - >-
          history -s 'wait_for_sim_time; rosservice call /uav1/control_manager/takeoff "altitude: 20.0"; rosservice call /uav2/control_manager/takeoff "altitude: 20.0"; rosservice call /uav3/control_manager/takeoff "altitude: 20.0"; rosservice call /uav4/control_manager/takeoff "altitude: 20.0"'

  - land_home:
      layout: tiled
      panes:
        - >-
          history -s 'rosservice call /task_allocate/stop; rosservice call /uav1/control_manager/land_home; rosservice call /uav2/control_manager/land_home; rosservice call /uav3/control_manager/land_home; rosservice call /uav4/control_manager/land_home'
