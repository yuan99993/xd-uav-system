# Three VTOLs after all have completed transition to forward flight.
# Coordinates and speeds are demonstration values in world ENU units.
mode: consensus
team_id: three_vtol_forward
members: [uav1, uav2, uav3]
common_frame: world
shape: circle
spacing: 60.0
fixedwing_minimum_slot_distance: 30.0
fixedwing_min_speed: 10.0
fixedwing_max_speed: 40.0
acquire_tolerance: 10.0
acquire_height_tolerance: 3.0
acquire_vertical_spacing: 15.0
acquire_timeout: 300.0
waypoints:
  - [-100.0, -100.0, 100.0]
  - [500.0, -100.0, 100.0]
  - [500.0, 500.0, 100.0]
  - [-100.0, 500.0, 100.0]
loop_path: true
corner_radius: 250.0
cruise_speed: 18.0
lookahead_distance: 50.0
consensus_gain: 0.1
convergence_time: 100.0
max_consensus_velocity: 5.0
