# Four identical VTOLs after all have completed transition to forward flight.
# Every member must load this same file. Coordinates are world ENU metres.
mode: consensus
team_id: four_vtol_forward
members: [uav1, uav2, uav3, uav4]
common_frame: world
shape: circle
spacing: 60.0
fixedwing_minimum_slot_distance: 30.0
fixedwing_min_speed: 11.0
fixedwing_max_speed: 24.0

# Fixed-wing aircraft keep flying during acquisition. Give them room to
# separate vertically and time to converge before following the route.
acquire_tolerance: 10.0
acquire_height_tolerance: 3.0
acquire_vertical_spacing: 15.0
acquire_timeout: 300.0

# A 600 m loop with 250 m rounded corners. At 18 m/s, the nominal speeds
# of the inner and outer 60 m-offset slots are about 13.7 and 22.3 m/s.
waypoints:
  - [-100.0, -100.0, 80.0]
  - [500.0, -100.0, 80.0]
  - [500.0, 500.0, 80.0]
  - [-100.0, 500.0, 80.0]
loop_path: true
corner_radius: 250.0
cruise_speed: 18.0
lookahead_distance: 50.0
consensus_gain: 0.1
convergence_time: 100.0
max_consensus_velocity: 5.0
