        fixedwing: /home/nvidia/xd-uavsystem-test/src/xd_uav_single_tf_manager/config/fixedwing_single_tf.yaml
        multirotor: /home/nvidia/xd-uavsystem-test/src/xd_uav_single_tf_manager/config/multirotor_single_tf.yaml
      controller_config_by_type:
