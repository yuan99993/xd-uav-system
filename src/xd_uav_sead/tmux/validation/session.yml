root: ./
name: sead-validation
socket_name: sead-validation
attach: false
pre_window: source /opt/ros/noetic/setup.bash; source /home/promise/catkin_ws/devel/setup.bash; export ROS_HOSTNAME=localhost; export ROS_MASTER_URI=http://localhost:11311; export DEBUG=false
startup_window: launch
windows:
  - launch:
      layout: tiled
      panes:
        - ./pane.sh roscore
        - ./pane.sh gazebo
        - ./pane.sh spawner
        - ./pane.sh uav1
        - ./pane.sh uav2
        - ./pane.sh uav3
  - status:
      layout: tiled
      panes:
        - ./status.sh
  - commands:
      layout: tiled
      panes:
        - ./commands.sh
