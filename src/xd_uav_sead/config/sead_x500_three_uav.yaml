# Optional SEAD-only overrides for a compact three-UAV simulation.
sead_runtime_mode: simple_strike

communication:
  mode: ros
  peer_ids: [1, 2, 3]

control:
  vehicle_type: multirotor

formation:
  spacing: 4.0
  standoff_distance: 12.0
  safe_separation: 2.0
  altitude_step: 0.5
  broadcast_interval: 0.2
  minimum_altitude: 1.0
  static_hold: true
