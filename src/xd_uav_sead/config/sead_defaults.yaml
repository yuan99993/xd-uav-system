# xd_uav_sead 默认参数
# 加载到 /uavX/sead_onboard 节点的私有参数空间

# --- SEAD 控制模式 ---
# direct_mavros保留原始控制路径；xd_control_manager通过仓库统一控制链。
control_backend: "direct_mavros"
control_reference_frame: "uav1/local_origin"

# swiftwing_vector: SwiftWing矢量控制（固定翼推荐）
# position_waypoint: 位置航点控制
sead_control_mode: "swiftwing_vector"

# --- Simple Strike 控制模式 ---
simple_strike_control_mode: "swiftwing_vector"

# --- SEAD 运行时模式 ---
# simple_strike: 简化3目标打击（无GA）
# dpga_sead: 完整DPGA任务分配
sead_runtime_mode: "simple_strike"

# --- XBee 通信波特率 ---
xbee_baud: 57600

# Optional compatibility hook for the original external formation launch.
# Leave disabled unless both package and launch file are explicitly provided.
start_external_formation_launch: false
formation_launch_pkg: ""
formation_launch_file: ""

# --- 编队参数（对应 FormationConfig）---
formation:
  spacing: 220.0
  standoff_distance: 5000.0
  safe_separation: 140.0
  altitude_step: 20.0
  broadcast_interval: 0.2
