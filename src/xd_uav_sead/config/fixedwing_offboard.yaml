offboard:
  # Fixed-wing PX4 has no multirotor-style POSCTL handoff.  Request the
  # native loiter mode atomically when the manager relinquishes OFFBOARD.
  stream:
    setpoint_rate: 100.0
    prestream_duration: 1.5

  mode_request:
    retry_interval: 1.0
    timeout: 10.0

  exit:
    cancel_mode: AUTO.LOITER
