# SEAD 规划器参数
# 加载到节点的私有命名空间

# --- GA 任务分配 ---
ga:
  population_size: 100
  time_interval: 0.5        # seconds, 每轮优化时间
  tournament_size: 3
  crossover_rate: 0.8
  mutation_rate: 0.15
  elite_count: 2

# --- Dubins 路径 ---
dubins:
  turning_radius: 35.0      # meters, 最小转弯半径 (默认, 会被 UAV config 覆盖)
  path_step: 3.0            # meters, 路径采样间隔

# --- 禁飞区避让 ---
airspace:
  default_clearance: 40.0   # meters, 安全距离
  zone_level2d: 1           # 默认 2D 避让级别

# --- 打击参数 ---
strike:
  waypoint_radius: 50       # meters, 到达判定半径
  height_offset: 0.0        # meters, 相对默认高度偏移
