# Driver-independent two-axis gimbal command policy. Angles are body-relative
# radians; rates are radians per second. These are simulation-safe defaults,
# not limits for an unspecified real device.
interfaces:
  command: "gimbal/command"
  state: "gimbal/state"
  joint_states: "joint_states"
  joint_trajectory: "gimbal/set_joint_trajectory"

joints:
  yaw: "gimbal_yaw_joint"
  pitch: "gimbal_pitch_joint"

state_frame: "base_link"
trajectory_reference_link: "world"
control_rate_hz: 50.0
command_timeout_sec: 0.5

limits:
  minimum_yaw_rad: -3.14159
  maximum_yaw_rad: 3.14159
  minimum_pitch_rad: -1.5708
  maximum_pitch_rad: 1.5708
  maximum_yaw_rate_rad_s: 1.0
  maximum_pitch_rate_rad_s: 1.0

home:
  yaw_rad: 0.0
  pitch_rad: 0.0
