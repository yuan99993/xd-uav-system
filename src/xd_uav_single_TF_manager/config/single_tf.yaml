# 本文件加载到/uavX/single_tf_manager节点的私有参数空间。
publish_rate: 30.0
input_timeout: 1.0

# 单机局部层只负责local_origin -> odom。
# 当前没有回环或全局修正输入，因此使用单位变换把标准TF链连接起来。
local_alignment:
  enabled: true
  parent_frame: local_origin
  child_frame: odom
  fallback_identity: true

  # 以后接入回环或全局修正时，消息表示local_origin下base_link的位姿。
  # 管理器会结合主估计里程计，反算并平滑local_origin -> odom。
  correction_topic: ""
  odometry_topic: state_estimator/main/odom
  max_position_variance: 100.0
  position_filter_alpha: 0.08
  yaw_filter_alpha: 0.08
  max_position_jump: 10.0
  max_yaw_jump: 1.57079632679

# 物理安装TF。实际安装位置变化时只修改这里。
static_transforms:
  - name: base_to_lidar
    enabled: true
    parent_frame: base_link
    child_frame: lidar_link
    translation: [0.0, 0.0, 0.10]
    rotation_rpy: [0.0, 0.0, 0.0]

  - name: lidar_to_lidar_imu
    enabled: true
    parent_frame: lidar_link
    child_frame: lidar_imu_link
    translation: [0.0, 0.0, 0.0]
    rotation_rpy: [0.0, 0.0, 0.0]

# 各来源自己的估计结果与原点对齐量只用于观察和坐标变换，
# 不会占用标准base_link，也不会改变主控制输出。
dynamic_transforms:
  - name: mavros_estimate
    enabled: true
    type: odometry
    topic: state_estimator/sources/mavros/odom
    parent_frame: odom
    child_frame: mavros_estimated_base_link
    invert: false

  - name: fastlio_estimate
    enabled: true
    type: odometry
    topic: state_estimator/sources/fastlio/odom
    parent_frame: odom
    child_frame: fastlio_estimated_base_link
    invert: false

  - name: mavros_alignment
    enabled: true
    type: transform_stamped
    topic: state_estimator/sources/mavros/alignment
    parent_frame: odom
    child_frame: mavros_origin
    invert: false

  - name: fastlio_alignment
    enabled: true
    type: transform_stamped
    topic: state_estimator/sources/fastlio/alignment
    parent_frame: odom
    child_frame: fastlio_origin
    invert: false
