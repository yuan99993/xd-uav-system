# 本文件加载到/uavX/single_tf_manager节点的私有参数空间。
publish_rate: 30.0
input_timeout: 1.0

# 单机局部层只负责local_origin -> odom。
# 默认使用GPS适配器发布的local_origin -> base_link反算局部修正。
# GPS无效时保留最后一次有效修正；尚未成功修正时使用单位变换连接TF树。
local_alignment:
  enabled: true
  parent_frame: local_origin
  child_frame: odom
  body_frame: base_link
  fallback_identity: true

  # body_pose：
  #   修正消息表示local_origin -> base_link，结合main/odom反算local_origin -> odom。
  # direct_transform：
  #   修正消息直接表示local_origin -> odom，不订阅也不使用odometry_topic。
  input_mode: body_pose
  correction_topic: global_alignment/gps/body_odometry
  correction_valid_topic: global_alignment/gps/valid
  odometry_topic: state_estimator/main/odom

  # 严格检查消息坐标系和协方差，避免未知协方差或错误frame进入TF。
  validate_message_frames: true
  require_positive_covariance: true
  max_position_variance: 100.0
  max_yaw_variance: 10.0
  max_time_difference: 0.10
  position_filter_alpha: 0.08
  yaw_filter_alpha: 0.08
  max_position_jump: 10.0
  max_yaw_jump: 1.57079632679

  # 直接输入local_origin -> odom时可改成下面的形式，同时启动时传入
  # gps_alignment_enabled:=false，避免GPS适配器成为无用节点：
  # input_mode: direct_transform
  # correction_topic: localization_correction/local_to_odom
  # correction_valid_topic: localization_correction/local_to_odom_valid

# 物理安装TF。实际安装位置变化时只修改这里。
static_transforms:
  - name: base_to_lidar
    enabled: true
    parent_frame: base_link
    child_frame: lidar_link
    translation: [0.0, 0.0, 0.10]
    rotation_rpy: [0.0, 0.0, 0.0]

  - name: lidar_to_lidar_imu
    enabled: true
    parent_frame: lidar_link
    child_frame: lidar_imu_link
    translation: [0.0, 0.0, 0.0]
    rotation_rpy: [0.0, 0.0, 0.0]

# 各来源自己的估计结果与原点对齐量只用于观察和坐标变换，
# 不会占用标准base_link，也不会改变主控制输出。
dynamic_transforms:
  - name: mavros_estimate
    enabled: true
    type: odometry
    topic: state_estimator/sources/mavros/odom
    parent_frame: mavros_origin
    child_frame: mavros_estimated_base_link
    invert: false

  - name: fastlio_estimate
    enabled: true
    type: odometry
    topic: state_estimator/sources/fastlio/odom
    parent_frame: fastlio_origin
    child_frame: fastlio_estimated_base_link
    invert: false

  - name: mavros_alignment
    enabled: true
    type: transform_stamped
    topic: state_estimator/sources/mavros/alignment
    parent_frame: odom
    child_frame: mavros_origin
    invert: false

  - name: fastlio_alignment
    enabled: true
    type: transform_stamped
    topic: state_estimator/sources/fastlio/alignment
    parent_frame: odom
    child_frame: fastlio_origin
    invert: false
