# Fixed-wing gimbal tuning. Topic and service names are still overridden by
# gm_tracking_control.launch; this file only changes controller behavior.
image_topic: /uav1/gimbal_camera/image_raw
initial_bbox_topic: /uav1/gm_control/initial_bbox
bbox_topic: /uav1/gm_control/target_bbox
command_topic: /uav1/gm_control/gimbal_cmd
state_topic: /uav1/gm_control/gimbal_state
error_topic: /gm_control/image_error
debug_image_topic: /gm_control/debug_image

publish_debug_image: true
control_rate: 50.0
control_mode: rate

# Fixed-wing images move continuously with the airframe, so the image loop
# needs enough proportional response to catch the target. Keep I/D at zero to
# avoid accumulated bias and amplification of frame-to-frame bbox noise.
pid:
  yaw:
    p: 45.0
    i: 0.0
    d: 0.0
    integral_limit: 0.5
  pitch:
    p: 35.0
    i: 0.0
    d: 0.0
    integral_limit: 0.5

yaw_sign: 1.0
pitch_sign: 1.0
max_yaw_rate_deg_s: 90.0
max_pitch_rate_deg_s: 90.0
max_yaw_angle_deg: 90.0
max_pitch_angle_deg: 90.0

target_lost:
  timeout_s: 0.3
  # Never start a search merely because the detector lost the target. Search
  # is an explicit operator action through start_search.
  action: stop
  hold_time_s: 0.2
  search_yaw_rate_deg_s: 0.0
  search_pitch_rate_deg_s: 0.0
  back_to_init_yaw_deg: 0.0
  back_to_init_pitch_deg: 0.0
  back_to_init_roll_deg: 0.0

# The adapter slews the zero-angle command instead of snapping to it. Four
# seconds is enough to recover from the normal ten-second search interval.
return_to_init_on_stop:
  enabled: true
  duration_s: 4.0

smoothing:
  enabled: true
  alpha: 0.30
  max_rate_change_deg_s2: 180.0

deadzone_x: 0.04
deadzone_y: 0.04
min_confidence: 0.0

tracker:
  tracker_type: color_tracker
  color_tracker:
    color: red
    min_area_px: 80.0
    min_width_px: 4.0
    min_height_px: 4.0
    morph_kernel: 5

  feature_tracker:
    tracker_algorithm: kcf
    template_match_threshold: 0.45
    tracker_safety:
      enabled: true
      max_center_jump_norm: 0.5
      min_area_ratio: 0.25
      max_area_ratio: 5.0
      edge_margin_px: 3.0
      max_fail_frames: 3
