# 估计器内部算法参数。定位源、修正量和话题只在sources.yaml中配置。
output_rate: 100.0
diagnostics_rate: 1.0
max_localization_delay: 10.0
# 放宽高延迟仿真中的消息时间戳超前容差。
max_future_stamp_lead: 2.0
max_dead_reckoning_time: 10.0
imu_timeout: 10.0
require_imu: true #true：IMU 掉线会停止有效主输出；false：定位健康时仍能输出，定位失效时则依赖最后状态做纯模型预测
frame_lookup_timeout: 10.0

# 首次初始化前要求所有必需修正连续稳定。适用于飞机仍在地面、仿真
# 尚在完成坐标/传感器初始化的启动阶段。位置容差较宽，以吸收仿真
# 初期抖动；若观测持续移动、时间戳重复或出现坐标系切换，则重新计时。
startup_initialization:
  enabled: true
  stable_duration: 5.0
  min_samples: 10
  max_sample_gap: 1.0
  position_xy_tolerance: 50.0
  position_z_tolerance: 30.0
  velocity_xy_tolerance: 5.0
  velocity_z_tolerance: 3.0
  heading_tolerance: 0.7
  yaw_rate_tolerance: 0.75
  # 在地面初始化时限制明显的滑行/爬升速度，避免把运动状态当作静止初值。
  velocity_xy_max_speed: 1.5
  velocity_z_max_speed: 0.75
  yaw_rate_max: 0.75

# 主估计结果除标准odom坐标系外，还可重发布到以下坐标系。
# 对应话题为state_estimator/main/frames/<坐标系>/odom。
main_republish_in_frames: [local_origin, world]

filter:
  initial_position_variance: 1.0
  initial_velocity_variance: 1.0
  initial_acceleration_variance: 10.0
  position_process_noise: 0.05
  velocity_process_noise: 0.50
  acceleration_process_noise: 2.0
  yaw_process_noise: 0.02
  yaw_rate_process_noise: 0.20
  imu_acceleration_variance: 0.50
  imu_yaw_rate_variance: 0.05
  # IMU三轴角速度差分后的低通时间常数，以及发布协方差。发布角加速度的滤波器参数
  angular_acceleration_time_constant: 0.05
  angular_acceleration_variance: 1.0
  angular_acceleration_limit: 100.0
  remove_gravity: true
  gravity: 9.80665
  acceleration_limit: 30.0

# 先经过绝对门限，再按配置使用NIS统计门限。
innovation_gate:
  position_xy: 50.0
  position_z: 40.0
  velocity_xy: 30.0
  velocity_z: 30.0
  heading: 1.57
  yaw_rate: 3.0
  use_nis: true
  # 默认只把NIS作为模型一致性诊断，不以它拒绝定位观测。多旋翼触地、碰撞
  # 或急刹时，恒加速度模型与真实运动短时不符是正常现象；真正的测量跳变
  # 仍由上面的绝对创新门限拦截。仅在协方差模型经过严格标定后才建议设true。
  hard_reject_nis: false
  position_xy_nis: 9.21
  position_z_nis: 6.63
  velocity_xy_nis: 9.21
  velocity_z_nis: 6.63
  heading_nis: 6.63
  yaw_rate_nis: 6.63

source_switching:
  # 数值越小优先级越高；高优先级源恢复后是否自动切回。
  switch_back_to_higher_priority: true
  minimum_active_time: 1.0
  cooldown: 0.5
