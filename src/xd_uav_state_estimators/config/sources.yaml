# 定位源接口及各来源的独立配置。所有相对话题都会解析到/uavX命名空间。
localization_sources: [mavros_local, fastlio]

sources:
  mavros_local:
    enabled: true
    topic: mavros/local_position/odom
    role: primary
    priority: 0
    timeout: 0.25
    use_position_xy: true
    use_altitude: true
    use_velocity_xy: true
    use_vertical_velocity: true
    use_heading: true
    twist_in_body_frame: true
    alignment:
      mode: align_on_activation
    frame_transform:
      use_tf_for_child_frame: true
      require_tf: true
      timeout: 0.02
    covariance:
      use_message: true
      position_xy: 0.01
      position_z: 0.05
      velocity_xy: 0.01
      velocity_z: 0.02
      heading: 0.02
    reliability:
      max_position_variance: 100.0
      max_velocity_variance: 100.0
      max_heading_variance: 10.0
      max_consecutive_rejections: 5
      quarantine_duration: 1.0
      recovery_min_samples: 20
      recovery_stable_time: 0.5

  fastlio:
    enabled: true
    topic: fastlio/Odometry
    role: fallback
    priority: 1
    timeout: 0.50
    use_position_xy: true
    use_altitude: true
    use_velocity_xy: false
    use_vertical_velocity: false
    use_heading: true
    twist_in_body_frame: false
    alignment:
      mode: align_on_activation
    frame_transform:
      use_tf_for_child_frame: true
      require_tf: true
      timeout: 0.05
    covariance:
      use_message: false
      position_xy: 0.05
      position_z: 0.10
      velocity_xy: 0.20
      velocity_z: 0.20
      heading: 0.05
    reliability:
      max_position_variance: 100.0
      max_velocity_variance: 100.0
      max_heading_variance: 10.0
      max_consecutive_rejections: 5
      quarantine_duration: 1.0
      recovery_min_samples: 20
      recovery_stable_time: 0.5

# 可选的指定坐标系位姿输出。这里只发布Odometry话题，绝不广播TF。
# TF管理器必须已经提供target_frame到body_frame的完整变换链。
frame_outputs:
  - name: world
    enabled: true
    target_frame: world
    topic: state_estimator/frames/world/odom
    lookup_timeout: 0.02
