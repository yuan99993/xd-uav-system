# Odometry适配器只读取输入消息的时间戳和数值，不依赖其frame_id。
# 适配器名称自动生成来源原点uavX/<名称>_origin；reference_frame指定输入
# 数值描述的机上参考点。适配器通过静态TF查询base_link -> reference_frame，
# 再输出统一的“来源原点 -> base_link”六类修正消息。估计器根据话题的
# 第一段名称自动找到数据提供者，并先用该提供者自己的对齐转换到odom；
# 每个逻辑来源通常只订阅同名适配器的修正，并由自己的滤波器形成完整状态；
# main只整包选择来源，不按position/velocity等分量跨来源组合。
odometry_adapters:
  mavros:
    input_topic: mavros/local_position/odom
    reference_frame: base_link
    tf_timeout: 0.1
    max_input_delay: 0.50
    fallback_covariance:
      position: 0.05
      velocity: 0.10
      heading: 0.05
      yaw_rate: 0.10

  fastlio:
    input_topic: fastlio/Odometry
    reference_frame: lidar_imu_link #通过获取reference_frame到baselink的变换来修正这个话题输入值，用于后续输出
    tf_timeout: 0.03
    max_input_delay: 0.50
    fallback_covariance:
      position: 0.05
      velocity: 0.10
      heading: 0.05
      yaw_rate: 0.10

  # OpenVINS 发布 /uavX/openvins/odomimu；其状态表示 IMU 位姿。
  # 当前仿真中 MAVROS IMU 的 frame_id 为 base_link，因此 reference_frame 设为
  # base_link。真机若 IMU 与 base_link 不重合，应改为 IMU 实际 frame 并发布静态 TF。
  openvins:
    input_topic: openvins/odomimu
    reference_frame: base_link
    tf_timeout: 0.03
    max_input_delay: 0.50
    fallback_covariance:
      position: 0.50
      velocity: 0.50
      heading: 0.25
      yaw_rate: 0.25

# localization_sources既是加载列表，也是来源名称的唯一入口。
# 列表中存在的来源一定会加载，因此每个来源不再设置enabled。
localization_sources: [mavros, fastlio, openvins]

sources:
  mavros:
    # 数值越小优先级越高，只用于自动选择当前主定位源。
    priority: 0

    # 字符串写法继承本组默认值；映射写法可覆盖单项参数。
    # 相对话题自动补成state_estimator_inputs/<配置值>。
    correction_defaults:
      timeout: 1.0
      required: true
    corrections:
      - position_xy: mavros/position_xy
      - position_z: mavros/position_z
      - velocity_xy: mavros/velocity_xy
      - velocity_z: mavros/velocity_z
      - heading: mavros/heading
      - yaw_rate:
          topic: mavros/yaw_rate
          timeout: 1.0
          required: false

    # 新来源成为主源时，把它的原点对齐到当前连续主状态。
    alignment:
      mode: align_on_activation

    reliability:
      max_position_variance: 100.0
      max_velocity_variance: 100.0
      max_heading_variance: 10.0
      max_yaw_rate_variance: 10.0
      max_consecutive_rejections: 5
      quarantine_duration: 1.0
      recovery_min_samples: 20
      recovery_stable_time: 0.5
      # correction timeout只使来源暂时无效；连续断流达到这里的时间，才认为
      # 定位节点可能重启并重新定义了自身原点。
      session_reset_timeout: 2.0

    # 发布该来源在指定坐标系下的估计结果，不产生TF。
    # republish_in_frames: [local_origin, world]
    republish_in_frames: [local_origin, world]

  fastlio:
    priority: 1

    correction_defaults:
      timeout: 0.50
      required: true
    corrections:
      - position_xy: fastlio/position_xy
      - position_z: fastlio/position_z
      - velocity_xy: fastlio/velocity_xy
      - velocity_z: fastlio/velocity_z
      - heading: fastlio/heading

      # 速度来自Fast-LIO自身ESKF发布的Odometry.twist，不混入MAVROS速度。
      # main整包接管这套位置、速度和航向状态。

    alignment:
      mode: align_on_activation

    reliability:
      max_position_variance: 100.0
      max_velocity_variance: 100.0
      max_heading_variance: 10.0
      max_yaw_rate_variance: 10.0
      max_consecutive_rejections: 5
      quarantine_duration: 1.0
      recovery_min_samples: 20
      recovery_stable_time: 0.5
      session_reset_timeout: 2.0

    republish_in_frames: [local_origin, world]

  # 初次接入时以较低优先级运行，仅观测和手动切换验证，不会自动取代
  # 健康的 MAVROS 或 Fast-LIO。确认表现后再按需要调整 priority。
  openvins:
    priority: 2

    correction_defaults:
      timeout: 0.50
      required: true
    corrections:
      - position_xy: openvins/position_xy
      - position_z: openvins/position_z
      - velocity_xy: openvins/velocity_xy
      - velocity_z: openvins/velocity_z
      - heading: openvins/heading

    alignment:
      mode: align_on_activation

    reliability:
      max_position_variance: 100.0
      max_velocity_variance: 100.0
      max_heading_variance: 10.0
      max_yaw_rate_variance: 10.0
      max_consecutive_rejections: 5
      quarantine_duration: 1.0
      recovery_min_samples: 20
      recovery_stable_time: 0.5
      session_reset_timeout: 2.0

    republish_in_frames: [local_origin, world]
