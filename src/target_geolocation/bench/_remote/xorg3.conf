# QoderWork 推流专用 X 显示 :3 —— NVIDIA 驱动（与 GDM :0 同款配置，硬件 GLX 已验证）
# 无窗口管理器、无输入设备需求，固定 Virtual 分辨率供 Chromium kiosk 全屏渲染。
# 用法: sudo Xorg :3 -config /home/nvidia/workspace/stream/runtime/xorg3.conf -noreset -nolisten tcp -logfile /tmp/Xorg.3.log
#
# 前置条件（2026-10-28 排查结论，务必遵守，否则 selkies 推出去是纯黑帧）：
#   1) nvidia-drm 必须加载。用 modeset=0（render-only）即可：
#        /etc/modules-load.d/nvidia-drm.conf  -> nvidia-drm
#        /etc/modprobe.d/nvidia-drm.conf      -> options nvidia-drm modeset=0
#      没有 /dev/dri/renderD128 时，NVIDIA X 驱动的整屏回读（XGetImage / XShmGetImage）
#      会稳定返回全零，xwd / ffmpeg x11grab / gst ximagesrc 全部抓黑。
#      modeset=1 会抢走 modesetting permission，X :3 直接 "no screens found"，不能用。
#   2) DPMS / 屏保必须关闭。屏幕一熄，回读同样变全零。下面 ServerFlags 全置 0。
Section "Module"
    Disable     "dri"
EndSection
Section "ServerFlags"
    Option      "BlankTime"     "0"
    Option      "StandbyTime"   "0"
    Option      "SuspendTime"   "0"
    Option      "OffTime"       "0"
EndSection
Section "Device"
    Identifier  "Tegra3"
    Driver      "nvidia"
    Option      "AllowEmptyInitialConfiguration" "true"
EndSection
Section "Screen"
    Identifier  "Screen3"
    Device      "Tegra3"
    SubSection  "Display"
        Depth   24
        Virtual 1920 1080
    EndSubSection
EndSection
