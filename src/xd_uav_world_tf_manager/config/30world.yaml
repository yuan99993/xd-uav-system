# 共享世界坐标定义。一个世界TF管理器进程负责清单中的全部飞机。
world:
  frame_id: world

  # 世界ENU切平面的WGS84基准点。
  datum:
    # fixed：使用下方手动配置的经纬高；topic：读取 sensor_msgs/NavSatFix。
    mode: topic
    topic: /world/datum
    latitude: -37.71775430000001
    longitude: 144.8345184
    altitude: -6.409311559051275
    # 改为 topic 后，以下经纬高不再使用，world 原点由 /world/datum 提供。
    # latitude: 47.3977421
    # longitude: 8.5455934
    # altitude: 535.3249164945362

  # 地理ENU平面在world坐标系中的位置和航向。
  position: [0.0, 0.0, 0.0]
  enu_to_world_yaw: 0.0

# 在此增删飞机名称，控制哪些飞机接入world。
# vehicles: [uav1, uav2, uav3, uav4]
vehicles: [uav1, uav2, uav3, uav4, uav5, uav6, uav7, uav8, uav9, uav10, uav11, uav12, uav13, uav14, uav15, uav16, uav17, uav18, uav19, uav20, uav21, uav22, uav23, uav24, uav25, uav26, uav27, uav28, uav29, uav30]

vehicle_configs:
  uav1:
    enabled: true
    mode: gps_origin
    origin_topic: /uav1/mavros/global_position/gp_origin_lla #这个话题提供的local_origin的经纬度位置
    local_origin_frame: uav1/local_origin
    position_offset: [0.0, 0.0, 0.0]
    yaw_offset: 0.0
