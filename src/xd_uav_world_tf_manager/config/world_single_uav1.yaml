# Shared-world alignment used by the single-uav1 SITL session.
world:
  frame_id: world
  datum:
    latitude: 47.397800
    longitude: 8.545594
    altitude: 47.325902413
  position: [0.0, 0.0, 0.0]
  enu_to_world_yaw: 0.0

vehicles: [uav1]

vehicle_configs:
  uav1:
    enabled: true
    mode: gps_origin
    origin_topic: /uav1/mavros/global_position/gp_origin
    local_origin_frame: uav1/local_origin
    position_offset: [0.0, 0.0, 0.0]
    yaw_offset: 0.0
