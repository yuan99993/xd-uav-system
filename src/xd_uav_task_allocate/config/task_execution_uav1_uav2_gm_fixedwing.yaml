# Fixed-wing flow: uav1 searches and geolocates; uav2 approaches and starts
# gimbal-assisted fixed-wing tracking when it sees the same class near target.

target_registry:
  # There is one configured scout (uav1); repeated stable observations from
  # that aircraft are sufficient to confirm a target.
  confirmation_distinct_uavs: 1

allocation:
  worker_execution:
    # Fallback visual-handoff radius. A worker-specific value overrides this.
    target_radius_m: 20.0
    worker_overrides:
      uav2:
        # uav2 may begin GM tracking inside this radius after a matching
        # camera detection.
        target_radius_m: 4000.0
        # The selected-detection bridge ID (for example 900000000) is not the
        # global track ID expected by xd_uav_track/SelectTrack. Let that node
        # auto-select from uav2's selected-only detection stream.
        pass_detection_track_id: false

post_arrival:
  mode: task_execute
  handoff_mode: visual
  action_name_template: /{worker}/task_execute/execute
  server_wait_timeout_sec: 2.0
  failure_policy: fail
  retry_delay_sec: 5.0
  control_handoff_settle_sec: 0.5

  default_task:
    task_type: track
    local_track_id: -1
    # This is the fixed-wing gimbal follower. gm_velocity_chase is for
    # multicopter-style velocity control.
    follower_profile: gm_velocity_chase
    required_execution_sec: 60.0
    maximum_duration_sec: 120.0

  mobility_profile_overrides:
    fixedwing:
      follower_profile: gm_velocity_chase

  worker_overrides:
    uav2:
      task_type: track
      handoff_mode: visual
      follower_profile: gm_velocity_chase

    # uav3:
    #   task_type: arrive
    #   handoff_mode: position
    #   follower_profile: ""

  class_overrides: {}
