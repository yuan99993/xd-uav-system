# Fixed-wing worker configuration. uav2's local detections are used for the
# visual handoff and are also consumed by xd_uav_track after task execution starts.
workers:
  uav2:
    mobility_profile: fixedwing
    localization:
      world_odometry_topic: /uav2/state_estimator/main/frames/world/odom
    health:
      control_state_topic: /uav2/control_manager/state
    coverage:
      nominal_speed_mps: 15.0
    fixedwing:
      # Zero preserves SearchArea.altitude from the incoming search-area topic.
      coverage_altitude_m: 0.0
      coverage_lane_spacing_m: 0.0
      minimum_turn_radius_m: 30.0
      turn_waypoint_spacing_m: 5.0
      straight_lead_distance_m: 30.0
      waypoint_acceptance_radius_m: 20.0
      waypoint_altitude_tolerance_m: 10.0
      pass_cross_track_limit_m: 40.0
    topics:
      # Matches the selected SmartTracker bridge output used by the uav2
      # integration launch; the coordinator consumes this for visual handoff.
      detections: /uav2/detect/input/detections_2d
      planner_task_path: /uav2/planning/task_path
      planner_cancel: /uav2/planning/cancel
      route_preview: /uav2/planning/route_preview
      planner_status: /uav2/planning/status
      controller_path: /uav2/control/reference/path
      controller_path_status: /uav2/controller/path_status
      controller_setpoint: /uav2/control/reference/setpoint

