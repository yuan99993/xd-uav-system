# Dedicated uav3/uav4 Typhoon GM workers used by session_two_fixed_two_gm_px4.
# The task allocator navigates to a confirmed target, then task_execute starts
# TRACK with the gm_velocity_chase profile from task_execution_two_fixed_two_gm.yaml.
workers:
  uav3:
    mobility_profile: hover
    localization:
      world_odometry_topic: /uav3/state_estimator/main/frames/world/odom
    health:
      control_state_topic: /uav3/control_manager/state
    multirotor:
      waypoint_gap: 10.0
    topics:
      detections: /uav3/detect/detections
      planner_goal: /uav3/planning/goal
      planner_task_path: /uav3/planning/task_path
      planner_cancel: /uav3/planning/cancel
      route_preview: /uav3/planning/route_preview
      planner_status: /uav3/planning/status
      controller_setpoint: /uav3/control/reference/setpoint

  uav4:
    mobility_profile: hover
    localization:
      world_odometry_topic: /uav4/state_estimator/main/frames/world/odom
    health:
      control_state_topic: /uav4/control_manager/state
    multirotor:
      waypoint_gap: 10.0
    topics:
      detections: /uav4/detect/detections
      planner_goal: /uav4/planning/goal
      planner_task_path: /uav4/planning/task_path
      planner_cancel: /uav4/planning/cancel
      route_preview: /uav4/planning/route_preview
      planner_status: /uav4/planning/status
      controller_setpoint: /uav4/control/reference/setpoint
