# Example mixed reconnaissance fleet. Select this file with the launch
# scout_config argument after adapting names and topics to the real vehicles.
# mission.yaml auto-selects hierarchical search from these two vehicle types.
scouts:
  uav1:
    vehicle_type: fixedwing
    localization:
      world_odometry_topic: /uav1/state_estimator/main/frames/world/odom
    health:
      control_state_topic: /uav1/control_manager/state
    execution:
      # May override the mission-wide planner/backend independently per vehicle.
      backend: direct_controller_test
    coverage:
      nominal_speed_mps: 15.0
    fixedwing:
      # Keep coarse search at the fixed-wing loiter/takeoff altitude instead of
      # inheriting the lower multirotor SearchArea altitude.
      coverage_altitude_m: 40.0
      # Fixed-wing coarse-search swath. Set this from camera FOV, altitude and
      # required overlap; it is intentionally wider than multirotor fine search.
      coverage_lane_spacing_m: 30.0
      # The SITL plane at 15 m/s can comfortably fly a 30 m-radius turn.
      # Scan lanes are visited in a spread order and every turn starts outside
      # the search polygon; this radius should describe the real aircraft.
      minimum_turn_radius_m: 30.0
      # This samples the same curve; reducing it does not shorten or smooth the
      # geometry.  Five metres keeps the controller's linearly interpolated arc
      # below about 10 degrees per sample for a 30 m turn radius.
      turn_waypoint_spacing_m: 5.0
      # Straight distance outside the boundary before/after each coverage leg,
      # allowing the aircraft to roll level before entering the target region.
      straight_lead_distance_m: 30.0
      waypoint_acceptance_radius_m: 20.0
      waypoint_altitude_tolerance_m: 10.0
      pass_cross_track_limit_m: 40.0
    topics:
      detections: /uav1/track/detections
      planner_goal: /uav1/planning/goal
      controller_setpoint: /uav1/control/reference/setpoint
      controller_path: /uav1/control/reference/path
      controller_path_status: /uav1/controller/path_status
      mission_path: /uav1/planning/mission_path
      planner_status: /uav1/planning/status

  uav2:
    vehicle_type: multirotor
    localization:
      world_odometry_topic: /uav2/state_estimator/main/frames/world/odom
    health:
      control_state_topic: /uav2/control_manager/state
    execution:
      backend: direct_controller_test
    coverage:
      nominal_speed_mps: 4.0
    topics:
      detections: /uav2/track/detections
      planner_goal: /uav2/planning/goal
      controller_setpoint: /uav2/control/reference/setpoint
      mission_path: /uav2/planning/mission_path
      planner_status: /uav2/planning/status
