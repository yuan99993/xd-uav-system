# Worker behavior after navigation reaches the assigned target. Depending on
# handoff_mode, execution can require a local camera detection or use only the
# shared-world position target. This file is loaded separately from allocation.
post_arrival:
  # arrive: preserve the original behavior and complete immediately at REACHED.
  # task_execute: send ExecuteTaskGoal and complete only after action success.
  mode: arrive  # arrive | task_execute
  # auto maps fw_metric_*/OBSERVE/INTERCEPT to position-only handoff and other
  # task types to the legacy camera+position handoff. Override with visual or
  # position when the mission knows the worker sensor availability.
  handoff_mode: auto  # auto | visual | position

  action_name_template: /{worker}/task_execute/execute
  server_wait_timeout_sec: 2.0

  # fail: leave the task FAILED for operator retry.
  # retry: return it to PENDING and temporarily exclude the failed worker.
  failure_policy: fail  # fail | retry
  retry_delay_sec: 5.0
  # After Track stops, wait briefly before either direct control or planning
  # receives the next task, allowing queued tracking references to drain.
  control_handoff_settle_sec: 0.5

  default_task:
    task_type: track
    # -1 asks xd_uav_track to auto-select a local detection.
    local_track_id: -1
    # Empty uses the profile already configured in xd_uav_track.
    follower_profile: ""
    # Zero uses xd_uav_task_execute/config/task_execute.yaml defaults.
    required_execution_sec: 0.0
    maximum_duration_sec: 0.0

  # Merge order is: default -> mobility profile (legacy fallback) -> worker ID
  # -> target class. Therefore class_overrides always has the highest priority.
  # These examples are intentionally inactive while mode=arrive.
  mobility_profile_overrides:
    hover:
      follower_profile: mc_velocity_chase
    fixedwing:
      follower_profile: fw_velocity_vector

  class_overrides: {}
    # "0":
    #   task_type: track
    #   required_execution_sec: 10.0

  worker_overrides: {}
    # uav3:
    #   task_type: track
    #   follower_profile: gm_velocity_vector
