offboard:
  # 按参考类型选择输出；simple_goal使用position_target配置。
  # internal控制起飞、悬停、降落、等待/保持等内部参考。
  output:
    reference_types:
      position_target: raw_local
      path: raw_attitude
      trajectory: raw_attitude
      internal: raw_local

  # 预发送完成后才请求OFFBOARD。
  stream:
    setpoint_rate: 100.0
    prestream_duration: 1.5

  # PX4模式与解锁服务的请求节奏。
  mode_request:
    retry_interval: 1.0
    timeout: 10.0

  # 用户主动取消OFFBOARD后交还给PX4的模式。
  exit:
    cancel_mode: POSCTL
