safety:
  odometry_timeout: 0.20
  imu_timeout: 0.30
  acceleration_timeout: 0.20
  airspeed_timeout: 0.30
  # 固定翼SITL静止时VFR_HUD可能出现轻微负空速；容差内按0m/s处理。
  # 小于此负值下限仍视为传感器异常。
  airspeed_negative_tolerance: 3.0
  command_timeout: 0.20
  estimator_status_timeout: 0.30
  stable_duration: 1.5
  invalid_grace_duration: 0.5
  landed_confirm_duration: 0.5
  # 触地确认后先持续发送零推力，再尝试普通上锁。
  touchdown_idle_duration: 0.75
  # PX4落地检测异常并拒绝普通上锁时的受限回退。
  # 仅在本次飞行已确认在空中且控制器持续确认触地后生效。
  allow_force_disarm: true
  force_disarm_timeout: 2.0
  require_acceleration: true
  require_localization: false
  minimum_groundspeed_for_course: 0.5
  # 固定翼即使PX4短暂报告ON_GROUND，也必须降到此地速以下才确认触地和解锁。
  fixedwing_touchdown_max_groundspeed: 2.0
