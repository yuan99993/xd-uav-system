# 四旋翼与固定翼共用的控制器接口、参考坐标和home配置。
# controller.launch先加载本文件，再加载机型配置；机型配置可按需覆盖公共默认值。

state_timeout: 0.20
reference_timeout: 0.50
reference_acceleration_timeout: 0.50

reference_frames:
  # 控制器保留参考原始frame，在计算控制量前转换到ControlState.header.frame_id。
  # 无斜杠名称只匹配与控制odom相同命名空间下的frame；
  # 以/开头的名称按全局frame精确匹配。
  allowed: [local_origin, /world,  odom]
  global_alignment_frames: [local_origin, /world, odom]
  require_global_alignment: true
  global_alignment_timeout: 1.0
  transform_timeout: 0.03
  max_transform_age: 0.50
  failure_grace_duration: 0.50
  max_inertial_frame_tilt: 0.10

simple_goal:
  # RViz的2D Nav Goal通常把z写成0，默认保持控制器当前的期望高度。
  use_message_z: false

home:
  # takeoff: 起飞时优先在frame中记录当前位置；对齐不可用时退化为odom。
  # fixed_local: 始终使用下面配置的固定点，起飞、降落和复位都不会覆盖它。
  mode: fixed_local
  frame: local_origin
  #fixed_position: [-60.0, 0.0, 0.0] #固定翼要有补偿值，不然落不准
  fixed_position: [0.0, 0.0, 0.0]
  fixed_yaw: 0.0
  use_home_yaw: true
