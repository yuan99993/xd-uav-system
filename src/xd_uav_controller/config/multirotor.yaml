control_rate: 100.0

multirotor:
  # 机体模型与悬停工作点。
  model:
    gravity: 9.80665
    hover_throttle: 0.7

  path_following:
    nominal_speed: 3.0
    lookahead_distance: 2.0
    terminal_slowdown_distance: 4.0
    completion_position_tolerance: 0.50
    completion_speed_tolerance: 0.30
    reacquisition_distance: 4.0

  # 期望姿态到body-rate的内环增益。
  attitude_control:
    gain: [5.0, 5.0, 2.0]

  position_control:
    # 状态为[position, velocity]，MPC直接输出期望加速度。
    mpc:
      horizon: 26
      # EGO replans in flight.  Penalise aggressive control changes enough to
      # track its continuous P/V/A reference without exciting lateral sway.
      q: [500.0, 180.0]
      terminal_q: [1000.0, 400.0]
      r: 45.0

    # 对位置、速度和纯加速度控制模式分别补偿低频扰动。
    # 积分状态直接表示附加加速度；专用起飞/降落阶段自动停用。
    disturbance_rejection:
      position_integral_gain: [0.08, 0.08, 0.15]
      position_integral_acceleration_limit: [0.60, 0.60, 0.80]

      velocity_integral_gain: [1.0, 1.0, 2.0]
      velocity_integral_acceleration_limit: [1.0, 1.0, 1.0]

      # 纯加速度模式使用去重力后的acceleration_odom形成PI闭环。
      acceleration_feedback_gain: [0.25, 0.25, 0.35]
      acceleration_integral_gain: [0.20, 0.20, 0.40]
      acceleration_integral_acceleration_limit: [1.0, 1.0, 1.0]

      # 根据最终可实现加速度冻结或释放积分，防止执行器饱和后wind-up。
      anti_windup_gain: 1.5

  # 控制器最终输出的统一安全限制，不属于MPC代价参数。
  limits:
    minimum_throttle: 0.05
    maximum_throttle: 0.90
    maximum_tilt: 0.52
    maximum_body_rate: [2.5, 2.5, 1.8]
    maximum_velocity_xy: 4.0
    maximum_velocity_z: 3.0
    maximum_acceleration_xy: 3.5
    maximum_acceleration_z: 2.0
    maximum_jerk_xy: 5
    maximum_jerk_z: 2

  # 起飞与降落保持为两种机型一致的顶层业务阶段；具体参数由当前机型文件定义。
  takeoff:
    default_altitude: 3.0
    max_velocity: 0.8
    max_acceleration: 0.6
    position_tolerance: 0.15
    velocity_tolerance: 0.15
  
  landing:
    # odom使用相对起飞/Home地面的Z，适用于没有下视测距的仿真；它不能识别
    # 高于起飞点的平台。distance_sensor仅把纵向降落切换为下视AGL，XY仍使用
    # 当前定位源；需要飞机模型和MAVROS distance_sensor插件提供Range话题。
    height_source: distance_sensor
  
    # land_home水平返航的速度上限。控制器会根据剩余距离和多旋翼最大加速度
    # 自动提前减速，不会把该速度保持到目标点。
    return_max_velocity: 1.0
    position_tolerance: 0.15
    velocity_tolerance: 0.10
  
    distance_sensor_cfg:
      timeout: 0.5
      descent_velocity: 0.35
      final_descent_velocity: 0.15
      slow_height: 0.7
      # 触地时下视传感器到平台的预期距离；应按安装高度和最小量程设置。
      touchdown_offset: 0.15
      touchdown_height_tolerance: 0.10
      # 使用滤波后的AGL变化率，不依赖当前定位源的odom.vz。
      touchdown_velocity_tolerance: 0.20
      velocity_filter_time_constant: 0.30
  
    # 没有下视测距时保留原有的相对Home/起飞点高度降落逻辑。
    odom_cfg:
      descent_velocity: 0.35
      final_descent_velocity: 0.15
      slow_height: 0.7
      touchdown_offset: 0.10
      touchdown_height_tolerance: 0.05
      touchdown_velocity_tolerance: 0.20
