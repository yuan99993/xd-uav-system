# Continuation experiment from the packaged 10-epoch FloodNet pilot.
# Keep this outside the runtime model directory until full tiled validation
# and deployment gates pass.
profile_name: floodnet_segformer_b0_finetune
base_profile: floodnet_segformer_b0_pilot_10e
dataset:
  # Replace this path on the training computer.
  extraction_root: /data/floodnet/extracted
  supervised_root: FloodNet-Supervised_v1.0
  official_split:
    train_images: 1445
    val_images: 450
    test_images: 448
  class_names:
    - background
    - building_flooded
    - building_non_flooded
    - road_flooded
    - road_non_flooded
    - water
    - tree
    - vehicle
    - pool
    - grass
model:
  checkpoint: nvidia/mit-b0
  num_classes: 10
  input_crop_px: [1024, 1024]
  gradient_checkpointing: false
optimization:
  amp: true
  micro_batch_size: 1
  effective_batch_size: 12
  gradient_accumulation_steps: 12
  epochs: 11
  backbone_learning_rate: 0.00002
  decoder_learning_rate: 0.0002
  weight_decay: 0.01
  warmup_steps: 12
  max_gradient_norm: 1.0
  loss:
    weighted_cross_entropy: 1.0
    dice: 0.75
    class_weight_cap: 4.0
sampling:
  rare_hazard_crop_probability: 0.85
  rare_hazard_class_ids: [1, 3, 5, 7]
augmentation:
  horizontal_flip_probability: 0.5
validation:
  mode: fixed_center_crop
  max_images: 450
output:
  root: /data/sar_yolo/experiments/floodnet_segformer_b0_finetune_smoke
  save_every_epoch: true
  seed: 20260819
