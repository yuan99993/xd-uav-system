# Resource-safe pilot derived from floodnet_segformer_b0_profile.yaml.
# RTX 3050 Laptop (4 GB): effective batch 12 = micro-batch 1 x accumulation 12.
profile_name: floodnet_segformer_b0_pilot_10e
base_profile: floodnet_segformer_b0
dataset:
  # Replace these paths on the training computer.
  archive: /data/floodnet/raw/FloodNet.zip
  extraction_root: /data/floodnet/extracted
  supervised_root: FloodNet-Supervised_v1.0
  official_split:
    train_images: 1445
    val_images: 450
    test_images: 448
  class_names:
    - background
    - building_flooded
    - building_non_flooded
    - road_flooded
    - road_non_flooded
    - water
    - tree
    - vehicle
    - pool
    - grass

model:
  checkpoint: nvidia/mit-b0
  num_classes: 10
  input_crop_px: [1024, 1024]
  # Hugging Face's SegformerForSemanticSegmentation implementation does not
  # expose gradient checkpointing. Memory is controlled by micro-batch size.
  gradient_checkpointing: false

optimization:
  amp: true
  micro_batch_size: 1
  effective_batch_size: 12
  gradient_accumulation_steps: 12
  epochs: 10
  optimizer: AdamW
  backbone_learning_rate: 0.00006
  decoder_learning_rate: 0.0006
  weight_decay: 0.01
  warmup_steps: 150
  max_gradient_norm: 1.0
  loss:
    weighted_cross_entropy: 1.0
    dice: 0.5
    class_weighting: median_frequency_balanced
    class_weight_cap: 3.0

sampling:
  rare_hazard_crop_probability: 0.65
  rare_hazard_class_ids: [1, 3, 5, 7]
  random_crop_probability: 0.35

augmentation:
  horizontal_flip_probability: 0.5
  brightness_contrast: true

validation:
  # Fixed centre crop per official validation image. Full 1024/768 tiled
  # validation remains the promotion-stage evaluation, after this pilot.
  mode: fixed_center_crop
  max_images: 450

output:
  # Keep training output outside the runtime model directory until promotion.
  root: /data/sar_yolo/experiments/floodnet_segformer_b0_pilot_10e
  save_every_epoch: true
  seed: 20260816
