# Additional mode only. Original YOLO/feature/color configuration is preserved.
FusionTracker:
  visual_hold_sec: 1.5
  # A manually seeded template may publish validated matches before YOLO binds
  # an identity; after confirmation, visual_hold_sec applies.
  manual_seed_visual_without_yolo: true
  # Keep a low-confidence coast box alive through brief YOLO/template gaps;
  # SmartTracker publishes it as prediction_only and clears it after this age.
  prediction_hold_sec: 1.50
  # Retain the selected detector identity through YOLO/template gaps. Zero means
  # keep the lock until the operator explicitly selects another target.
  detector_id_memory_sec: 1.5
  # Long-recovery threshold and stale unselected-template TTL since last YOLO.
  reacquire_hold_sec: 8.0
  # Zero keeps the single selected identity/template until explicit reselection.
  # A lost target publishes no stale box; matching continues in the background.
  identity_memory_ttl_sec: 0.0
  long_reacquire_appearance_gate: 0.85
  long_reacquire_quality_gate: 0.65
  long_reacquire_minimum_score: 0.65
  long_reacquire_require_camera_motion: true
  reacquire_motion_horizon_sec: 2.0
  max_frame_gap_sec: 0.75
  max_area_ratio: 2.5
  center_gate_sizes: 1.4
  appearance_gate: 0.70
  quality_gate: 0.35
  ambiguity_margin: 0.12
  reacquire_confirm_frames: 3
  detector_weight: 0.70
  # Blend a confirmed re-acquisition into the continuous template/predicted box
  # instead of snapping the control output to one YOLO rectangle.
  reacquire_detector_gain: 0.35
  detector_authority_confidence: 0.85
  minimum_detector_confidence: 0.50
  minimum_maintenance_confidence: 0.10
  # Refresh the local visual reference from accepted current YOLO observations.
  local_template_refresh_sec: 0.75
  # Each YOLO target keeps a grayscale template matched in a local ROI per frame.
  # Accepted detector boxes refresh templates slowly.
  template_match_threshold: 0.52
  long_template_match_threshold: 0.72
  template_update_confidence: 0.70
  # Run at most one multi-scale template correction per target every 0.5 sec.
  template_search_period_sec: 0.5
  class_groups: [[0, 1, 2, 3]]
  selection_max_age_sec: 10.0
  selection_max_frames: 24
  selection_max_bytes: 25165824
  # Late detections require validated frame-to-frame LK alignment, never a
  # raw old-frame box relabelled with a new timestamp. All caches are bounded.
  async_max_result_age_sec: 2.0
  camera_motion:
    enabled: true
    max_gap_sec: 0.75
    max_features: 160
    minimum_inliers: 12
