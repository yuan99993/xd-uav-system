# Overrides for the XD ground-vehicle integration only.
# SmartTracker keeps the existing YOLO + BoT-SORT path as the default. Runtime
# switching is explicit through ~switch_tracking_mode; publishing an ROI alone
# never changes modes. Manual modes remain selected after target loss and wait
# for a new ROI until the service switches back to SmartTracker.
Default_Tracker: SmartTracker # SmartTracker / FeatureTracker / ColorTracker

SmartTracker:
  # xd_vehicle_latest.pt uses the local training label space:
  # car=0, ar-car=1, tank=2. Filtering is applied both inside Ultralytics and
  # before SmartTracker draws or publishes detections.
  SMART_TRACKER_ALLOWED_CLASS_IDS: [0, 1, 2]
  # Gazebo's older meshes/textures have a domain gap from COCO photographs.
  SMART_TRACKER_CONFIDENCE_THRESHOLD: 0.85
  SMART_TRACKER_MAX_DETECTIONS: 30

  # ByteTrack is sufficient for the fixed overhead camera and lighter than
  # BoT-SORT on the 2 GB deployment GPU.
  TRACKER_TYPE: BoT-SORT

ManualBoxTracker:
  enabled: true
  initial_roi_topic: sar_yolo_detector/manual/initial_roi

  # FeatureTracker and ColorTracker are independent modes selected through the
  # switch service. Both modes wait for exactly one initial ROI after switching.
  class_id: 2                  # class attached to the manual Detection2D
  track_id: 900000000          # stable ID, kept inside signed int32 range
  minimum_confidence: 0.0

  feature_tracker:
    tracker_algorithm: kcf     # auto / csrt / kcf / mil / template
    template_match_threshold: 0.45
    template_search_expansion: 2.5
    tracker_safety:
      enabled: true
      max_center_jump_norm: 0.35
      min_area_ratio: 0.25
      max_area_ratio: 4.0
      # Zero permits a valid target to leave/enter at an image edge. Increase
      # this only when edge boxes are known to be false tracks.
      edge_margin_px: 0.0
      max_fail_frames: 3

  color_tracker:
    # Empty: wait for an ROI and learn its colour. Non-empty: detect that colour
    # directly in the complete image without requiring an initial ROI. A service
    # request color_name overrides this startup value each time the mode switches.
    color: ""                  # "" / red / green / blue / white / black / custom
    min_area_px: 80.0
    min_width_px: 4.0
    min_height_px: 4.0
    # Each custom entry is [h_min, s_min, v_min, h_max, s_max, v_max]. Red often
    # needs two ranges because HSV hue wraps at 0/180.
    custom_hsv_ranges:
      - [0, 80, 50, 12, 255, 255]
      - [168, 80, 50, 180, 255, 255]
    histogram_bins: 32
    minimum_saturation: 40
    minimum_value: 32
    backprojection_threshold: 16
    morph_kernel: 5
    term_iterations: 10
    term_epsilon: 1.0
