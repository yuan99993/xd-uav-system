# Overrides for the XD ground-vehicle integration only.
# FusionTracker is the active detector/tracker mode. ColorTracker and
# FeatureTracker remain explicit UI-selectable alternatives.
Default_Tracker: FusionTracker

SmartTracker:
  # xd_vehicle_train7.pt label space: car=0, ar-car=1, tank=2, m142=3.
  # Filtering is applied by the YOLO backend and again before FusionTracker
  # publishes detector candidates.
  SMART_TRACKER_ALLOWED_CLASS_IDS: [1, 2, 3]
  # Gazebo's older meshes/textures have a domain gap from COCO photographs.
  # Match the detector deployment profile: keep distant vehicle candidates so
  # the downstream tracker can associate them over time.
  SMART_TRACKER_CONFIDENCE_THRESHOLD: 0.10
  SMART_TRACKER_MAX_DETECTIONS: 10
  # All four labels belong to the vehicle parent class. Suppress duplicate
  # tank/m142/etc. boxes BEFORE BoT-SORT allocates identities. A conservative
  # overlap threshold preserves nearby vehicles better than agnostic IoU=0.30.
  SMART_TRACKER_AGNOSTIC_NMS: true
  SMART_TRACKER_IOU_THRESHOLD: 0.60

  # Preserve the detector's BoT-SORT identity input for FusionTracker.
  TRACKER_TYPE: BoT-SORT
  SMART_TRACKER_TRACKER_CONFIG_PATH: config/vehicle_botsort.yaml
  SMART_TRACKER_INFERENCE_IMAGE_SIZE: 512

# Draw the track phase into the annotated frame before it leaves the YOLO node.
# The image remains on sar_yolo_detector/smart/annotated; only these small
# tracker-state messages cross ROS subscribers.
PhaseOverlay:
  enabled: true
  input_detections_topic: track/selected_detections
  status_topic: track/status
  gimbal_state_topic: track/gimbal_state
  detection_timeout_sec: 0.5
  status_timeout_sec: 0.5
  gimbal_state_timeout_sec: 0.5
  attacking_min_tracking_duration_sec: 1.0
  attacking_error_threshold: 0.05
  attacking_error_exit_threshold: 0.40
  attacking_gimbal_yaw_threshold_rad: 0.08
  attacking_gimbal_yaw_exit_threshold_rad: 0.18

# std_srvs/SetBool true on the auto-select service selects one target in
# FusionTracker or ColorTracker. A configured ColorTracker color produces
# candidate boxes immediately, but does not select one without this switch.
AutoSelect:
  enabled_at_startup: false
  stable_frames: 1
  # Keep the auto-selected target locked. Resume searching only after it has
  # produced no valid tracking box for this long.
  lost_hold_sec: 4.0
  # YOLO confidence is already filtered by its detector threshold. Color
  # components use the tracker minimum-area filter instead.
  minimum_confidence: 0.0
  max_frame_gap_sec: 1.0

ManualBoxTracker:
  enabled: true
  initial_roi_topic: sar_yolo_detector/manual/initial_roi

  # FeatureTracker and ColorTracker are independent modes selected through the
  # switch service. FeatureTracker publishes its valid ROI box directly as the
  # selected target; it does not require a separate select_pixel click.
  class_id: 2                  # class attached to the manual Detection2D
  track_id: 900000000          # stable ID, kept inside signed int32 range
  minimum_confidence: 0.0

  feature_tracker:
    tracker_algorithm: template     # auto / csrt / kcf / mil / template
    template_match_threshold: 0.45
    template_search_expansion: 2.5
    tracker_safety:
      enabled: true
      max_center_jump_norm: 0.35
      min_area_ratio: 0.25
      max_area_ratio: 4.0
      # Zero permits a valid target to leave/enter at an image edge. Increase
      # this only when edge boxes are known to be false tracks.
      edge_margin_px: 0.0
      max_fail_frames: 3

  color_tracker:
    # A named color produces full-image candidate boxes on entry without
    # selecting one. Set this to an empty string or "custom" to wait for a
    # user-selected ROI and learn its histogram for local tracking.
    color: "red"                  # red / green / blue / white / black / custom
    min_area_px: 80.0
    min_width_px: 4.0
    min_height_px: 4.0
    # Each custom entry is [h_min, s_min, v_min, h_max, s_max, v_max]. Red often
    # needs two ranges because HSV hue wraps at 0/180.
    custom_hsv_ranges:
      - [0, 80, 50, 12, 255, 255]
      - [168, 80, 50, 180, 255, 255]
    histogram_bins: 32
    minimum_saturation: 40
    minimum_value: 32
    backprojection_threshold: 16
    morph_kernel: 5
    term_iterations: 10
    term_epsilon: 1.0
