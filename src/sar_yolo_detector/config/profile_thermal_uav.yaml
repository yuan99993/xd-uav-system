# Runtime profile: high-altitude thermal UAV person detection (HIT-UAV).
input_image_topic: camera/ir/image_raw
detections_topic: sar_yolo_detector/thermal_uav/detections
vision_info_topic: sar_yolo_detector/thermal_uav/vision_info
debug_image_topic: sar_yolo_detector/thermal_uav/debug_image
thermal_info_topic: sar_yolo_detector/thermal_uav/thermal_info
image_source: ir
sensor_id: thermal_uav_primary
rescue_profile: thermal_uav
detector_name: sar_yolo_thermal_uav
model_version: thermal_uav_latest
model_sha256: e35ef56cc9d01a8db6fd5f6a6c56626e73c40f932f645cc48ccf1bc4a723f7ea
require_model_sha256: true
inference_backend: tensorrt
opencv_target: opencv_cpu
engine_path: ""
tensorrt_output_binding_names: []
dnn_backend: opencv_cpu
model_layout: ultralytics
input_width: 640
input_height: 640
swap_rb: false
input_mode: thermal_auto
thermal_normalization: percentile
thermal_lower_percentile: 1.0
thermal_upper_percentile: 99.0
thermal_bad_pixel_correction: true
thermal_clahe_enabled: false
temperature_scale: 1.0
temperature_offset: 0.0
temperature_unit: raw
tiling_enabled: true
tiling_policy: always
height_topic: altimeter/range
gsd_topic: perception/gsd_m_per_px
tiling_min_height_m: 40.0
tiling_min_gsd_m_per_px: 0.05
target_inference_gsd_m_per_px: 0.03
tiling_metric_timeout_sec: 1.0
tile_width_px: 640
tile_height_px: 640
tile_overlap_ratio: 0.25
tile_include_full_frame: true
tile_merge_overlap: 0.40
confidence_threshold: 0.20
nms_threshold: 0.45
minimum_box_size_px: 2.0
maximum_detections: 200
class_agnostic_nms: false
allowed_class_ids: [0]
require_capture_timestamp: true
reject_out_of_order: true
future_timestamp_tolerance_sec: 0.02
maximum_capture_age_sec: 0.50
stale_input_warning_sec: 1.0
publish_debug_image: false
test_detections: [[320.0, 320.0, 100.0, 160.0, 0.95, 0]]
class_names: [person, bicycle, car, other_vehicle]
