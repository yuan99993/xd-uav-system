# Runtime profile: wildfire crew/asset detection in long-wave IR.
input_image_topic: camera/ir/image_raw
detections_topic: sar_yolo_detector/wildfire_ir/detections
vision_info_topic: sar_yolo_detector/wildfire_ir/vision_info
debug_image_topic: sar_yolo_detector/wildfire_ir/debug_image
thermal_info_topic: sar_yolo_detector/wildfire_ir/thermal_info
image_source: ir
sensor_id: wildfire_ir_primary
rescue_profile: wildfire_ir
detector_name: sar_yolo_wildfire_ir
model_version: fireman_multiclass_thermal_50ep
model_sha256: a798ae337f474cd49fd7f88b4a74d25af086a4148efeb33524d883ad2eb68410
require_model_sha256: true
inference_backend: tensorrt
opencv_target: opencv_cpu
engine_path: ""
tensorrt_output_binding_names: []
dnn_backend: opencv_cpu
model_layout: ultralytics
input_width: 640
input_height: 640
swap_rb: false
input_mode: thermal_auto
thermal_normalization: percentile
thermal_lower_percentile: 1.0
thermal_upper_percentile: 99.0
thermal_bad_pixel_correction: true
thermal_clahe_enabled: false
tiling_enabled: true
tiling_policy: always
tile_width_px: 640
tile_height_px: 640
tile_overlap_ratio: 0.25
tile_include_full_frame: true
tile_merge_overlap: 0.40
confidence_threshold: 0.25
nms_threshold: 0.45
minimum_box_size_px: 2.0
maximum_detections: 200
class_agnostic_nms: false
allowed_class_ids: [0, 1, 2]
require_capture_timestamp: true
reject_out_of_order: true
future_timestamp_tolerance_sec: 0.02
maximum_capture_age_sec: 0.50
stale_input_warning_sec: 1.0
publish_debug_image: false
test_detections: [[320.0, 320.0, 100.0, 160.0, 0.95, 0]]
class_names: [fire_region, smoke_region, building]
