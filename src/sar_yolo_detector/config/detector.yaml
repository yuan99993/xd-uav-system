# Standalone SAR YOLO detector defaults.
# The class_names order must exactly match the exported ONNX model.

input_image_topic: camera/image_raw
detections_topic: sar_yolo_detector/detections
vision_info_topic: sar_yolo_detector/vision_info
debug_image_topic: sar_yolo_detector/debug_image
thermal_info_topic: sar_yolo_detector/thermal_info

image_source: eo
sensor_id: camera_primary
rescue_profile: generic
detector_name: sar_yolo_opencv_dnn
model_version: custom
model_sha256: ""
require_model_sha256: false
database_version: 1

# Inference backends: opencv_dnn | tensorrt | test. The current implementation
# accepts FP32- or FP16-I/O TensorRT engines built for the deployment GPU.
inference_backend: opencv_dnn
opencv_target: opencv_cpu       # opencv_cpu | opencv_opencl | opencv_cuda
engine_path: ""                 # required only for inference_backend: tensorrt
tensorrt_output_binding_names: []
# `dnn_backend` remains accepted for legacy launch files.
dnn_backend: opencv_cpu
model_layout: auto             # auto | yolov5 | ultralytics
input_width: 640
input_height: 640
swap_rb: true
input_mode: color              # color | thermal_auto

# High-altitude/GSD adaptation. If the source exceeds the tile dimensions,
# overlapping crops are inferred and merged globally at their boundaries.
tiling_enabled: false
# always | height (sensor_msgs/Range) | gsd (std_msgs/Float32, m/pixel)
tiling_policy: always
height_topic: altimeter/range
gsd_topic: perception/gsd_m_per_px
tiling_min_height_m: 40.0
tiling_min_gsd_m_per_px: 0.05
target_inference_gsd_m_per_px: 0.03
tiling_metric_timeout_sec: 1.0
tile_width_px: 640
tile_height_px: 640
tile_overlap_ratio: 0.20
tile_include_full_frame: true
tile_merge_overlap: 0.45

confidence_threshold: 0.25
nms_threshold: 0.45
minimum_box_size_px: 2.0
maximum_detections: 300
class_agnostic_nms: false

# Rescue-safe default: publish people only. Clear the array to publish all
# COCO classes, or add 1/2/3/5/7/8 for bicycle/car/motorcycle/bus/truck/boat.
allowed_class_ids: [0]

require_capture_timestamp: true
reject_out_of_order: true
future_timestamp_tolerance_sec: 0.02
maximum_capture_age_sec: 0.50
stale_input_warning_sec: 1.0
publish_debug_image: false

# Tracker publishes the selected target ROI only when its dedicated request
# path is enabled. Recheck is disabled by default to keep normal inference
# latency deterministic.
roi_recheck_enabled: false
roi_recheck_topic: tracker_node/roi_recheck_request
roi_recheck_interval_sec: 0.4
roi_recheck_context_scale: 1.8
roi_recheck_max_capture_delta_sec: 0.35
roi_recheck_merge_iou: 0.55

# Used only by `inference_backend: test`, for deterministic integration tests.
# Entries are [cx, cy, width, height, confidence, class_id] in model pixels.
test_detections: [[320.0, 320.0, 140.0, 220.0, 0.95, 0]]

