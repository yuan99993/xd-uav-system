# Unified SAR frontend profile: FloodNet semantic flood perception.
# The future SegFormer/TensorRT inference adapter should publish a timestamped
# MONO8 class-index mask on input_mask_topic. The C++ region extractor below is
# already part of sar_yolo_detector and can be run independently for replay.
profile_name: floodnet_segformer_b0
model_type: semantic_segmentation
inference_backend: tensorrt
# The C++ region extractor does not load this file itself; the SegFormer
# inference adapter resolves this relative path with rospack/package path.
model_path: models/floodnet_segformer_b0/floodnet_segformer_b0_pilot_10e_fp16.engine
model_sha256: 9c38136f1a07e618cd3792324d736c211467dcb43789d31cbd4c90e2b9b5eafa
require_model_sha256: true
onnx_path: models/floodnet_segformer_b0/floodnet_segformer_b0_pilot_10e_best.onnx
checkpoint_path: models/floodnet_segformer_b0/floodnet_segformer_b0_pilot_10e_best.pt

input_image_topic: camera/eo/image_raw
output_mask_topic: sar_yolo_detector/floodnet/class_mask
input_mask_topic: sar_yolo_detector/floodnet/class_mask
regions_topic: sar_yolo_detector/floodnet/regions
sensor_id: floodnet_eo_primary
task_frame: map

class_names:
  - background
  - building_flooded
  - building_non_flooded
  - road_flooded
  - road_non_flooded
  - water
  - tree
  - vehicle
  - pool
  - grass

hazard_class_ids: [1, 3, 5]
context_class_ids: [2, 4, 7]
global_semantic_ids: [0, 4, 0, 5, 0, 6, 0, 8, 6, 0]
minimum_region_area_px: 600
morphology_kernel_px: 3
association_iou_threshold: 0.25
min_confirmations: 3
confirmation_window_sec: 2.0
track_timeout_sec: 4.0
confidence_ema_alpha: 0.45
default_mask_confidence: 0.70
publish_pending_regions: true
snapshot_period_sec: 1.0
contour_simplification_ratio: 0.0025
maximum_contour_vertices: 96
minimum_region_update_period_sec: 0.5
region_update_iou_threshold: 0.90

require_mask_timestamp: true
reject_out_of_order: true
input_max_age_sec: 1.0
future_timestamp_tolerance_sec: 0.02
localization_mode: bearing_only
camera_info_topic: camera/eo/camera_info
terrain_grid_topic: terrain/grid
evidence_source_topic: camera/eo/image_raw
evidence_image_max_delta_sec: 0.10
evidence_frame_cache_size: 12
evidence_crop_cache_size: 256
evidence_jpeg_quality: 85
camera_info_max_delta_sec: 0.05
camera_info_allow_static: true
tf_lookup_timeout_sec: 0.05
terrain_max_age_sec: 30.0
minimum_intersection_range_m: 1.0
maximum_intersection_range_m: 5000.0
terrain_ray_step_m: 2.0
minimum_projection_coverage: 0.75
projection_position_stddev_m: 1.5
projection_attitude_stddev_deg: 1.0
ground_height_stddev_m: 1.0
