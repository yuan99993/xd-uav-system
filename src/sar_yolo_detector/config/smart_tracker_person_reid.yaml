# Opt-in deep person ReID overlay for SmartTracker.
#
# Load this after the normal SmartTracker profile via the launch
# ``overlay_config`` argument.  It intentionally does not change the
# detector model or class policy; deep ReID only helps associate an existing
# person detection after a temporary occlusion.
SmartTracker:
  TRACKER_TYPE: custom_reid
  ENABLE_APPEARANCE_MODEL: true
  APPEARANCE_FEATURE_TYPE: deep
  APPEARANCE_MATCH_THRESHOLD: 0.70
  MAX_REIDENTIFICATION_FRAMES: 30
  # COCO person and the package's thermal/maritime person profiles use class 0.
  # Change this explicitly for a model with a different semantic contract.
  DEEP_REID_CLASS_IDS: [0]

  DEEP_REID_MODEL_NAME: osnet_x0_25
  DEEP_REID_MODEL_PATH: models/person_reid/osnet_x0_25_market1501.pt
  DEEP_REID_MODEL_SHA256: c0ff09177a21417a19bc73bbf5af4eb5d2b097c2074ed35e67819ee6cd93612c
  DEEP_REID_REQUIRE_SHA256: true
  DEEP_REID_DEVICE: auto
  DEEP_REID_USE_GPU: true
  DEEP_REID_FALLBACK_TO_CPU: true
  DEEP_REID_INPUT_HEIGHT: 256
  DEEP_REID_INPUT_WIDTH: 128
  DEEP_REID_PIXEL_MEAN: [0.485, 0.456, 0.406]
  DEEP_REID_PIXEL_STD: [0.229, 0.224, 0.225]
