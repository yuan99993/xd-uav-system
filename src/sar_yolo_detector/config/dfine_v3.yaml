# Exact UE-tested profile with package-local model paths and shared class contract.
SmartTracker:
  DETECTION_BACKEND: dfine
  SMART_TRACKER_USE_GPU: true
  SMART_TRACKER_FALLBACK_TO_CPU: false
  SMART_TRACKER_REQUIRE_MODEL_SHA256: true
  SMART_TRACKER_MODEL_MAX_BYTES: 536870912
  SMART_TRACKER_INFERENCE_IMAGE_SIZE: 640
  SMART_TRACKER_DFINE_NATIVE_DEPLOY: true
  SMART_TRACKER_CLASS_CONSENSUS_ENABLED: true
  SMART_TRACKER_ALLOWED_CLASS_IDS:
  - 0
  - 1
  - 2
  SMART_TRACKER_CONFIDENCE_THRESHOLD: 0.1
  SMART_TRACKER_IOU_THRESHOLD: 0.6
  SMART_TRACKER_MAX_DETECTIONS: 30
  SMART_TRACKER_AGNOSTIC_NMS: true
  SMART_TRACKER_SELECTED_APPEARANCE_ENABLED: true
  ENABLE_APPEARANCE_MODEL: true
  APPEARANCE_FEATURE_TYPE: histogram
  CLASS_COMPATIBILITY_GROUPS:
  - - 0
    - 1
  - - 2
  TRACKER_TYPE: botsort
  SMART_TRACKER_TRACKER_CONFIG_PATH: config/vehicle_botsort.yaml
  SMART_TRACKER_GPU_MODEL_PATH: models/dfine_s_v3_16e/manifest.json
  SMART_TRACKER_CPU_MODEL_PATH: models/dfine_s_v3_16e/manifest.json
  SMART_TRACKER_MODEL_SHA256: a73446381ac6f6f106e1a1b476302fa9e809b3de9146aa832275fb8663c9cdae
ManualBoxTracker:
  enabled: true
  require_stamped_roi: true
  initial_roi_topic: sar_yolo_detector/manual/initial_roi
  class_id: -1
  track_id: 900000000
  minimum_confidence: 0.0
  feature_tracker:
    tracker_algorithm: kcf
    require_opencv_tracker: true
    template_match_threshold: 0.45
    template_search_expansion: 2.5
    tracker_safety:
      enabled: true
      max_center_jump_norm: 0.35
      min_area_ratio: 0.25
      max_area_ratio: 4.0
      edge_margin_px: 0.0
      max_fail_frames: 3
  color_tracker:
    color: ''
    min_area_px: 80.0
    min_width_px: 4.0
    min_height_px: 4.0
    custom_hsv_ranges:
    - - 0
      - 80
      - 50
      - 12
      - 255
      - 255
    - - 168
      - 80
      - 50
      - 180
      - 255
      - 255
    histogram_bins: 32
    minimum_saturation: 40
    minimum_value: 32
    backprojection_threshold: 16
    morph_kernel: 5
    term_iterations: 10
    term_epsilon: 1.0
profile: dfine_s_v3_legacy_fourmode
model_version: dfine_s_v3_16e
Default_Tracker: SmartTracker
