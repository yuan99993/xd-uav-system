# 输出频率和健康状态检查频率
output_rate: 100.0
diagnostics_rate: 2.0
input_timeout: 0.25
imu_timeout: 0.25
control_input_timeout: 0.10
max_prediction_step: 0.02
reset_gap: 1.0
max_localization_delay: 0.10
max_dead_reckoning_time: 1.0

# 延迟定位修正会回退到测量时间，修正后重新播放保存的IMU预测输入。
delayed_measurement:
  enabled: true
  history_duration: 1.0

# 默认里程计约定。各定位源可以在sources中单独覆盖此参数。
# nav_msgs/Odometry规定twist在child_frame_id坐标系中表达。
odom_twist_in_body_frame: true
output_twist_in_body_frame: true
# 状态估计器作为uavX/odom -> uavX/base_link的唯一TF发布者。
publish_tf: true
# 发布odom到各定位算法原点的对齐TF，例如odom -> fastlio_origin。
publish_source_origin_tf: true
require_imu: false

# 高频IMU预测。MAVROS的sensor_msgs/Imu加速度是在base_link中表达的比力，
# 水平静止时Z轴读数约为+9.81 m/s²。
imu_prediction:
  enabled: true
  remove_gravity: true
  gravity_magnitude: 9.80665
  acceleration_limit: 30.0
  input_coefficient: 10.0

  # 仅当里程计速度和陀螺仪角速度均表明飞机静止时估计残余加速度偏置。
  # 标定完成前，预测过程会安全退回常加速度自主模型。
  estimate_bias: true
  bias_samples: 100
  stationary_velocity_threshold: 0.15
  stationary_angular_velocity_threshold: 0.10
  initial_bias: {x: 0.0, y: 0.0, z: 0.0}

# 可选的控制器预测输入（geometry_msgs/AccelStamped）。
# linear表示期望的无偏加速度，angular.z预留为期望航向角速度。
use_control_input: false
control_input_coeff: 10.0  # IMU预测被禁用或不可用时的兼容回退参数

# 初始协方差
initial_covariance:
  position: 1.0
  velocity: 1.0
  acceleration: 10.0

# 过程噪声协方差，排列顺序与MRS状态定义一致。
process_noise:
  lateral:
    position: 0.1
    velocity: 1.0
    acceleration: 1.0
  altitude:
    position: 1.0
    velocity: 1.0
    acceleration: 1.0

# 测量噪声协方差。以下数值是方差，不是标准差。
measurement_noise:
  position_xy: 0.01
  position_z: 0.05
  velocity_xy: 0.01
  velocity_z: 0.02

# 超过创新阈值的测量会被拒绝，连续拒绝会触发定位源临时隔离。
innovation_limit:
  position_xy: 5.0
  position_z: 3.0
  velocity_xy: 5.0
  velocity_z: 3.0

# NIS门限同时考虑估计协方差和来源测量协方差。
innovation_gate:
  use_mahalanobis: true
  position_xy_nis: 9.21
  position_z_nis: 6.63
  velocity_xy_nis: 9.21
  velocity_z_nis: 6.63
  heading_nis: 6.63

# 航向角与航向角速度使用独立滤波器，避免角度跳变影响位置和高度状态。
heading:
  initial_covariance: 0.25
  initial_rate_covariance: 0.25
  process_noise: 0.01
  rate_process_noise: 0.10
  measurement_noise: 0.02
  rate_measurement_noise: 0.02
  innovation_limit: 1.57
  use_imu_rate: true
