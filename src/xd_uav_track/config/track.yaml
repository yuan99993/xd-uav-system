# xd_uav_track 主配置
# 单位约定：时间 s，角度 rad，距离 m，速度 m/s；图像量标注 normalized 时为 [-1, 1]。

# 本文件只保存跟踪、跟随和安全算法参数。
# UAV_NAME 和 body frame 由 launch 注入；话题使用相对名称，自动位于 UAV_NAME 下。

# 1. 运行方式 -----------------------------------------------------------------
runtime:
  publish_rate_hz: 30.0
  state_timeout_sec: 0.30
  # true：直接接 xd_uav_controller；false：只观察 track 下的诊断输出。
  publish_control_reference: true

# 2. ROS接口（相对名称会自动解析到 /UAV_NAME/...） ---------------------------
interfaces:
  input:
    # 唯一感知输入：一个候选和多个候选使用同一种消息。
    detections: "detect/detections"
    vehicle_state: "state_estimator/main/odom"
    gimbal_state: "track/gimbal_state"
    gimbal_status: "track/gimbal_status"
    # 可选 OCR/QR/AprilTag/人工编号证据；关闭 identity_hints 时无需发布。
    identity_hints: "track/identity_hints"
  output:
    # 真正送给现有控制器的速度参考。
    control_reference: "control/reference/setpoint"
    # 以下为可观测/调试输出，不是额外的飞控输入。
    body_velocity: "track/velocity_body"
    follower_command: "track/command"
    tracks: "track/tracks"
    status: "track/status"

# 3. Tracker：检测框 -> 稳定目标状态 -----------------------------------------
tracker:
  # false 时必须调用 ~start_tracker，避免检测器一启动飞机立即跟随。
  enabled_at_startup: false
  input_timeout_sec: 0.25
  minimum_confidence: 0.10
  confidence_hysteresis: 0.05

  # 选中轨迹进入 follower 前的轻量平滑。
  position_filter_alpha: 0.40
  velocity_filter_alpha: 0.25
  target_x: 0.0                    # 期望框中心，normalized
  target_y: 0.0

  # 空=接收全部；也可锁定 eo/ir/逻辑相机名。
  image_source: ""
  selection:
    auto_select: true              # 未手选时选择质量最高的 confirmed 轨迹
    # 已锁定目标暂时失检时，不自动跳到画面内的另一对象。
    # 与长期身份库一致：失联期间停止输出观测控制，但不自动锁定另一目标。
    locked_target_release_timeout_sec: 60.0
  global_identity:
    # Fixed and gimbal streams keep independent local tracklets. A selected
    # identity is promoted across them only after capture-time metric/world
    # gating; matching appearance never authorizes a handover by itself.
    enabled: true
    appearance_cosine: 0.78
  confidence:
    new_track: 0.20
    update: 0.05
  lifecycle:
    confirmation_hits: 2
    occlusion_frames: 5            # 该阶段允许 Kalman 预测继续短时控制
    removal_frames: 30
    # 非负时按采集时间管理，避免 5/15/30 FPS 下行为不同；负值保留旧帧数语义。
    occlusion_timeout_sec: 0.35
    removal_timeout_sec: 5.0
  limits:
    maximum_tracks: 128
    maximum_embedding_dimension: 2048
  association:
    iou_threshold: 0.20
    center_distance: 1.50
    appearance_cosine: 0.78        # 候选含 embedding 时启用外观重识别
    high_confidence: 0.50          # 高置信检测可创建新 ID
    low_confidence: 0.10           # 低置信检测只用于维持现有轨迹
    appearance_gallery_size: 12    # 保留跨光照、视角与相机来源的多样原型
    appearance_update_confidence: 0.60
    mahalanobis_gate: 16.0
    metric_innovation_distance_m: 25.0
  # 普通 ReID 始终是主通道；仅当前两名接近，或多个身份有至少两项
  # 粗特征一致时，才激活低频 Group-ReID 二次判别。
  group_reid:
    enabled: true
    appearance_cosine: 0.55
    aspect_log_gate: 0.55
    source_strict: false
    maximum_groups: 64
    trigger_minimum_features: 2
    trigger_score_margin: 0.12
    short_occlusion_sec: 1.0
    long_association_minimum_margin: 0.08
  long_term_identity:
    enabled: true
    ttl_sec: 60.0
    maximum_identities: 256
    appearance_cosine: 0.84
    minimum_margin: 0.08
    maximum_cost: 0.55
    reconfirmation_hits: 3
  identity_hints:
    # 接入实体喷涂号/OCR、二维码或 AprilTag 时启用。
    enabled: false
    maximum_time_delta_sec: 0.10
    minimum_confidence: 0.55
    hard_confidence: 0.90
    iou_gate: 0.30
    confirmations: 2
  world_identity:
    # 对每个有效 metric 候选按采集时刻姿态投影，而非使用接收时刻机体坐标。
    innovation_gate_sigma: 5.0
    # 失联后世界位置协方差随时间增长，避免长期使用过度自信的位置门控。
    process_noise_mps: 2.0
  kalman:
    process_noise: 1.0
    measurement_noise: 1.0

# 4. Follower：目标状态 -> 单一机体系速度向量 -------------------------------
follower:
  # mc_velocity_ground | mc_velocity_position | mc_velocity_distance
  # mc_velocity_chase | gm_velocity_chase | gm_velocity_vector
  # fw_velocity_vector
  profile: "mc_velocity_chase"
  lateral_guidance_mode: "coordinated_turn"  # coordinated_turn | sideslip
  enable_vertical_control: true
  distance_enable_yaw: false
  horizontal_deadband: 0.03
  vertical_deadband: 0.03

  pid:
    lateral:       {kp: 1.0, ki: 0.02, kd: 0.02, integral_limit: 0.3}
    vertical:      {kp: 0.6, ki: 0.02, kd: 0.02, integral_limit: 0.3}
    yaw:           {kp: 0.9, ki: 0.01, kd: 0.01, integral_limit: 0.2}
    ground_forward: {kp: 2.0, ki: 0.01, kd: 0.1, integral_limit: 0.3}

  limits:
    maximum_forward_velocity: 5.0
    maximum_reverse_velocity: 2.0
    maximum_lateral_velocity: 2.0
    maximum_vertical_velocity: 1.5
    maximum_yaw_rate: 1.2

  smoothing:
    velocity:
      enabled: true
      ema_alpha: 0.15
    yaw:
      enabled: true
      deadzone: 0.01
      maximum_acceleration: 1.57
      ema_alpha: 0.70
      speed_scaling_enabled: true
      minimum_speed: 0.5
      maximum_speed: 5.0
      low_speed_factor: 0.5

  target_loss:
    forward_velocity: 0.0
    reset_after_sec: 3.0

  chase:
    initial_forward_velocity: 0.0
    forward_velocity: 3.0
    forward_ramp_rate: 0.5

  # 候选检测含 body forward/right/down 相对位置/速度时，追逐模式自动叠加米制控制。
  relative_state:
    enabled: true
    target_forward_m: 8.0
    target_down_m: 0.0
    position_gain: 0.50
    velocity_feedforward: 1.0
    maximum_correction_mps: 3.0

  ground:
    altitude_scaling_enabled: true
    attitude_compensation_enabled: true
    base_adjustment_x: 0.2
    base_adjustment_y: 0.2
    altitude_factor: 0.005
    descend_to_target: false
    target_altitude: 3.0
    maximum_descent_velocity: 0.5

  gimbal:
    input_timeout_sec: 0.20
    mount_type: "HORIZONTAL"       # HORIZONTAL | VERTICAL | TILTED_45
    angle_filter_previous_weight: 0.70
    angle_deadzone: 0.035
    yaw_offset: 0.0
    pitch_offset: 0.0
    roll_offset: 0.0
    invert_yaw: false
    # Typhoon adapter publishes gm_control's logical angle (+pitch points down).
    # Its --pitch-sign only converts that logical angle to the Gazebo joint, so
    # inverting again here would make gm_velocity_chase command an ascent.
    invert_pitch: false
    invert_roll: false

  gm_velocity_chase:
    lateral_guidance_mode: "coordinated_turn"
    forward_mode: "CONSTANT"       # CONSTANT | PITCH_BASED
    base_forward_speed: 2.0
    forward_acceleration: 2.0
    pitch_velocity_scaling: 0.15
    pitch_deadzone: 0.035
    maximum_lateral_angle: 1.57
    maximum_vertical_angle: 1.57

  gm_velocity_vector:
    lateral_guidance_mode: "coordinated_turn"
    velocity: 3.0
    ramp_acceleration: 0.25
    # gm_velocity_vector follows the complete gimbal optical-axis vector.
    # With the Typhoon logical convention, +pitch points down and therefore
    # produces negative ENU velocity.z (descent).
    enable_vertical_control: true
    yaw_rate_gain: 0.5

  # 只生成速度向量；姿态、能量和油门全部由 xd_uav_controller 负责。
  fw_velocity_vector:
    pid:
      course:     {kp: 1.2, ki: 0.05, kd: 0.10, integral_limit: 0.35}
      climb_rate: {kp: 2.0, ki: 0.05, kd: 0.10, integral_limit: 0.8}
    airspeed: 15.0
    maximum_course_offset: 0.70
    maximum_climb_rate: 3.0

# 5. 跨模块安全策略 -----------------------------------------------------------
safety:
  # normalized Kalman 位置协方差的标准差比例；不受 640x480/1920x1080 影响。
  uncertainty:
    enabled: true
    nominal_sigma_normalized: 0.05
    slow_ratio: 1.0
    abort_ratio: 2.5
    minimum_scale: 0.25
    yaw_scale: 0.65
  reidentification:
    initial_scale: 0.35
    recovery_sec: 0.60
  profile_switch:
    minimum_interval_sec: 0.50
    blend_duration_sec: 0.50
  gimbal_fallback:
    # GM 姿态失效时：chase -> mc chase，vector -> mc distance。
    enabled: true
  emergency_stop_at_startup: false
