# xd_uav_track 主配置
# 单位约定：时间 s，角度 rad，距离 m，速度 m/s；图像量标注 normalized 时为 [-1, 1]。

# 本文件只保存跟踪、跟随和安全算法参数。
# UAV_NAME 和 body frame 由 launch 注入；话题使用相对名称，自动位于 UAV_NAME 下。

# 1. 运行方式 -----------------------------------------------------------------
runtime:
  publish_rate_hz: 100.0
  state_timeout_sec: 5.0
  # true：直接接 xd_uav_controller；false：只观察 track 下的诊断输出。
  publish_control_reference: true
  profiles:
    # Fixed-wing metric guidance uses the world-frame odometry stream and a
    # slower controller loop with a longer estimator grace period.
    fw_metric_pursuit: {publish_rate_hz: 30.0, state_timeout_sec: 1.0}
    fw_metric_orbit: {publish_rate_hz: 30.0, state_timeout_sec: 1.0}

# 2. ROS接口（相对名称会自动解析到 /UAV_NAME/...） ---------------------------
interfaces:
  input:
    # 唯一感知输入：一个候选和多个候选使用同一种消息。
    detections: "track/selected_detections"
    vehicle_state: "state_estimator/main/odom"
    gimbal_state: "track/gimbal_state"
    gimbal_status: "track/gimbal_status"
    # Shared world-frame target hand-off used by fw_metric_* profiles.
    metric_target: "track/metric_target"
    # target_geolocation emits the gimbal range solution in the local odom frame.
    gimbal_metric_target: "target/metric_target"
  profiles:
    fw_metric_pursuit:
      input:
        detections: "detect/detections"
        vehicle_state: "state_estimator/main/frames/world/odom"
    fw_metric_orbit:
      input:
        detections: "detect/detections"
        vehicle_state: "state_estimator/main/frames/world/odom"
  output:
    # 真正送给现有控制器的速度参考。
    control_reference: "control/reference/setpoint"
    # 以下为可观测/调试输出，不是额外的飞控输入。
    body_velocity: "track/velocity_body"
    follower_command: "track/command"
    tracks: "track/tracks"
    status: "track/status"

# 3. Tracker：检测框 -> 稳定目标状态 -----------------------------------------
tracker:
  # false 时必须调用 ~start_tracker，避免检测器一启动飞机立即跟随。
  enabled_at_startup: false
  input_timeout_sec: 3.0
  minimum_confidence: 0.0
  confidence_hysteresis: 0.0
  profiles:
    fw_metric_pursuit: {input_timeout_sec: 0.30, minimum_confidence: 0.0}
    fw_metric_orbit: {input_timeout_sec: 0.25, minimum_confidence: 0.0}

  # Shared multi-source identity and handover settings used by fixed-wing
  # metric pursuit/orbit. The long removal window keeps the public target ID
  # available through a full orbit and subsequent visual reacquisition.
  source_policy: "auto_handover"
  source_handover_timeout_sec: 0.75
  source_quality_handover:
    enabled: true
    min_active_quality: 0.0
    min_incoming_quality: 0.0
    quality_margin: 0.0
    cooldown_sec: 1.0
  source_aware: true
  source_cross_class_reject: true
  source_identity_max_age_sec: 0.50
  source_handover_distance_m: 25.0
  source_track_timeout_sec: 40.0
  select_capture_tolerance_sec: 0.10
  reject_out_of_order_timestamps: true
  source_clock_reset_jump_sec: 5.0
  emit_candidates: false

  # 选中轨迹进入 follower 前的轻量平滑。
  position_filter_alpha: 0.40
  velocity_filter_alpha: 0.25
  target_x: 0.0                    # 期望框中心，normalized
  target_y: -0.10

  # 空=接收全部；也可锁定 eo/ir/逻辑相机名。
  image_source: ""
  global_identity:
    enabled: true
    # This deployment uses vehicle-only classes (car/ar-car/tank/m142), so a
    # view-dependent subtype change is a soft penalty, not a hard ID split.
    # Cross-camera IDs still require synchronized, calibrated metric matches.
    cross_source_metric_enabled: true
    cross_source_max_time_delta_sec: 0.35
    cross_source_max_distance_m: 4.0
    cross_source_max_position_variance_m2: 9.0
    # Only truly simultaneous calibrated observations are covariance-fused.
    # Wider hand-off matching remains 0.35 s; fusing delayed views would lag a
    # moving target rather than improve its inertial center estimate.
    cross_source_fusion_max_time_delta_sec: 0.05
  tracklet_stitching:
    enabled: true
    # Keep lost identities long enough for typical short/medium visual gaps,
    # while bounding both age and total identity memory.
    archive_ttl_sec: 40.0
    # A still-selected identity is retained longer, but after the ordinary
    # motion archive expires it can only be restored by a strong unique ReID
    # match; old constant-velocity extrapolation is intentionally ignored.
    locked_identity_archive_ttl_sec: 600.0
    locked_identity_min_appearance_cosine: 0.90
    maximum_identities: 512
    # A new local ID must pass metric trajectory gates and remain the same
    # best candidate on consecutive confirmed observations before it inherits
    # an archived global/public identity.
    confirmation_frames: 3
    maximum_confirmation_gap_sec: 0.50
    maximum_distance_m: 25.0
    maximum_speed_mps: 25.0
    maximum_velocity_delta_mps: 8.0
    mahalanobis_gate_sq: 11.34
    process_noise_m2_per_s2: 2.0
    minimum_position_variance_m2: 0.25
    minimum_appearance_cosine: 0.82
    # A viewpoint flip may weaken ReID; short gaps can still be stitched when
    # measured world motion is uniquely consistent within these tighter gates.
    motion_only_max_gap_sec: 15.0
    motion_only_max_residual_m: 10.0
    motion_only_max_velocity_delta_mps: 6.0
    minimum_score: 0.45
    minimum_score_margin: 0.20
  selection:
    auto_select: true              # 未手选时选择质量最高的 confirmed 轨迹
    # The input is SAR's single UI-selected detection; release a stale ID
    # quickly so a newly selected detector track can be followed.
    locked_target_release_timeout_sec: 0.5
  confidence:
    new_track: 0.0
    update: 0.0
  lifecycle:
    confirmation_hits: 1
    occlusion_frames: 5            # 该阶段允许 Kalman 预测继续短时控制
    removal_frames: 1200
    reference_fps: 30.0
    # PixEagle-compatible time lifecycle; keep frame fields for older launch
    # configs while all runtime decisions use source timestamps when available.
    occlusion_timeout_sec: 2.0
    removal_timeout_sec: 40.0
    reacquisition_after_sec: 0.35
    reacquisition_confirm_hits: 3
    reacquisition_mode: "balanced" # changed detector ID needs appearance evidence after long loss
    maximum_size_change_ratio: 2.5
    exit_edge_margin: 0.15
  limits:
    maximum_tracks: 128
    maximum_embedding_dimension: 2048
  association:
    iou_threshold: 0.20
    center_distance: 1.50
    metric_distance_m: 35.0
    ambiguity_margin: 0.08
    flexible_class_matching: true
    # All train7 labels are vehicle subclasses. A YOLO class flip must not
    # break a confirmed identity; geometry, motion and ambiguity gates remain.
    compatible_class_ids: [0, 1, 2, 3]
    class_history_size: 10
    search_expansion_rate_per_sec: 6.0
    search_expansion_cap: 2.0
    lenient_iou_scale: 0.4
    lenient_iou_floor: 0.10
    appearance_distance_gate_factor: 3.0
    appearance_cosine: 0.78        # 候选含 embedding 时启用外观重识别
    high_confidence_threshold: 0.0
    appearance_gallery_size: 5
    confidence_smoothing_alpha: 0.80
    confidence_decay_rate: 0.05
  kalman:
    process_noise: 1.0
    measurement_noise: 1.0

# 4. Follower：目标状态 -> 单一机体系速度向量 -------------------------------
follower:
  # mc_velocity_ground 从上往下看，下视相机对齐
  # mc_velocity_position 控制飞机yaw和上下
  # mc_velocity_distance 控制飞机左右平移
  # mc_velocity_chase 带有固定前向速度的，同时可选转向或者侧移
  # gm_velocity_chase 依据云台角度，进行转向或者侧移，同时前向速度固定
  # gm_velocity_vector 依据云台三轴角度对一个前向速度向量分解
  # fw_velocity_vector: 固定翼前视相机，向量跟踪
  # gmfw_velocity_vector: 固定翼云台相机，向量跟踪
  # fw_metric_pursuit: 固定翼目标跟踪
  # fw_metric_orbit: 固定翼到目标附近盘旋
  profile: "gmfw_velocity_vector"
  lateral_guidance_mode: "coordinated_turn"  # coordinated_turn | sideslip
  enable_vertical_control: true
  distance_enable_yaw: true
  horizontal_deadband: 0.03
  vertical_deadband: 0.01

  pid:
    lateral:       {kp: 5.0, ki: 0.02, kd: 0.5, integral_limit: 0.3}
    vertical:      {kp: 25.0, ki: 0.04, kd: 0.02, integral_limit: 0.3}
    yaw:           {kp: 5.0, ki: 0.01, kd: 1.0, integral_limit: 0.2}
    ground_forward: {kp: 2.0, ki: 0.01, kd: 0.1, integral_limit: 0.3}

  limits:
    maximum_forward_velocity: 20.0
    maximum_reverse_velocity: 5.0
    maximum_lateral_velocity: 50.0
    maximum_vertical_velocity: 50.0
    maximum_yaw_rate: 2.0

  smoothing:
    velocity:
      enabled: true
      ema_alpha: 0.15
    yaw:
      enabled: true
      deadzone: 0.01
      maximum_acceleration: 1.57
      ema_alpha: 0.70
      speed_scaling_enabled: true
      minimum_speed: 0.5
      maximum_speed: 5.0
      low_speed_factor: 0.5

  target_loss:
    forward_velocity: 0.0
    reset_after_sec: 3.0

  chase:
    initial_forward_velocity: 0.0
    forward_velocity: 0.0
    forward_ramp_rate: 0.5

  # 候选检测含 body forward/right/down 相对位置/速度时，追逐模式自动叠加米制控制。
  relative_state:
    enabled: true
    target_forward_m: 8.0
    target_down_m: 0.0
    position_gain: 0.50
    velocity_feedforward: 1.0
    maximum_correction_mps: 3.0

  ground:
    altitude_scaling_enabled: true
    attitude_compensation_enabled: true
    base_adjustment_x: 0.2
    base_adjustment_y: 0.2
    altitude_factor: 0.005
    descend_to_target: false
    target_altitude: 1.0
    maximum_descent_velocity: 0.5

  gimbal:
    input_timeout_sec: 0.20
    mount_type: "HORIZONTAL"       # HORIZONTAL | VERTICAL | TILTED_45
    angle_filter_previous_weight: 0.70
    angle_deadzone: 0.035
    yaw_offset: 0.0
    pitch_offset: 0.0
    roll_offset: 0.0
    invert_yaw: false
    # gimbal_attitude_bridge already publishes track convention:
    # positive pitch points down. Do not invert it again here.
    invert_pitch: false
    invert_roll: false

  gm_velocity_chase:
    lateral_guidance_mode: "coordinated_turn"
    forward_mode: "CONSTANT"       # CONSTANT | PITCH_BASED
    base_forward_speed: 15.0
    forward_acceleration: 5.0
    pitch_velocity_scaling: 0.15
    pitch_deadzone: 0.035
    maximum_lateral_angle: 1.57
    maximum_vertical_angle: 1.57

  gm_velocity_vector:
    lateral_guidance_mode: "coordinated_turn"
    velocity: 8.0
    ramp_acceleration: 3.0
    # Follow the gimbal line of sight so horizontal and vertical motion keep
    # the target's approach angle instead of using a fixed forward speed.
    # Positive pitch points down and produces negative ENU velocity.z.
    enable_vertical_control: true
    yaw_rate_gain: 0.5

  # 只生成速度向量；姿态、能量和油门全部由 xd_uav_controller 负责。
  fw_velocity_vector:
    pid:
      course:     {kp: 1.2, ki: 0.05, kd: 0.10, integral_limit: 0.35}
      climb_rate: {kp: 2.0, ki: 0.05, kd: 0.10, integral_limit: 0.8}
    airspeed: 15.0
    maximum_course_offset: 0.70
    maximum_climb_rate: 3.0

  # Fixed-wing world-frame metric guidance. The selected follower/profile
  # chooses pursuit or orbit while each profile keeps its own airspeed limits.
  fw_metric_pursuit:
    enable_vertical_control: false
    airspeed: 15.0
    maximum_course_offset: 0.70
    maximum_climb_rate: 3.0

  fw_metric_orbit:
    enable_vertical_control: false
    airspeed: 15.0
    maximum_course_offset: 0.70
    maximum_course_rate_radps: 0.35
    maximum_climb_rate: 3.0

  # Metric settings are read for either fw_metric_* profile. The tracker
  # enables this block automatically when one of those profiles is selected.
  target_guidance:
    enabled: false
    mode: "metric_orbit"
    source_policy:
      enabled: true
      fixed_camera_token: "fixed"
      gimbal_token: "gimbal"
      unknown_as_fixed_camera: true
    observation:
      policy: "metric_required"
      metric_timeout_sec: 0.30
      max_position_sigma_m: 12.0
    orbit:
      radius_m: 80.0
      direction: "auto"
      capture_hysteresis_m: 12.0
      minimum_turn_radius_m: 45.0
      radial_gain: 0.40
      radial_damping: 0.30
      target_velocity_feedforward: true
      publish_course_rate_feedforward: true
      publish_position_reference: true
    maximum_course_offset: 1.20
    # Direct XYZ approach speed and 3D arrival tolerance.
    direct_control:
      speed_mps: 35.0
      arrival_radius_m: 0.1
    fixed_camera:
      fov_constraint_enabled: true
      fov_margin_ratio: 0.10
      preserve_orbit_on_fov_loss: true
      visibility_direction_selection_enabled: true
    gimbal:
      dynamic_fov_enabled: true
      dynamic_fov_margin_ratio: 0.12
      min_fov_rad: 0.10
      zoom_reference_ratio: 1.0
      zoom_margin_gain: 0.05
    predictive_fov:
      enabled: true
      fx: 46.9882335
      fy: 46.9882335
      cx: 320.5
      cy: 240.5
      width: 640.0
      height: 480.0
      horizon_sec: 0.6
      optical_to_body_rpy: [3.14159265359, 0.0, -1.57079632679]
      translation: [0.0, 0.0, 0.2]
    fixed_wing:
      kinematics_enabled: true
      airspeed_mps: 15.0
      maximum_bank_angle_deg: 35.0
      gravity_mps2: 9.81
      entry_altitude_hold_enabled: true
      entry_altitude_offset_m: 0.0
      entry_altitude_reference_m: 35.0
      entry_target_down_m: 0.0
      altitude_gain: 0.35
    maximum_course_rate_radps: 0.35
    target_loss:
      coast_time_sec: 2.0
      # One orbit at 15 m/s on an 80 m radius takes about 34 s. The pursuit
      # profile shortens this with the per-profile value below.
      orbit_time_sec: 35.0
      hold_process_sigma_mps: 0.20
      center_hold_enabled: true
      center_hold_time_sec: 85.0
      center_hold_process_sigma_mps: 0.05
      inertial_coast_state_timeout_sec: 1.0
    metric_velocity_estimation:
      enabled: true
      position_filter_enabled: true
      position_filter_alpha: 0.30
      position_maximum_innovation_m: 18.0
      filter_alpha: 0.35
      maximum_speed_mps: 40.0
      stddev_mps: 3.0
      world_filter_enabled: true
      world_filter_model: "imm"
      world_filter_process_accel_stddev_mps2: 1.5
      world_filter_mahalanobis_gate: 16.27
      world_filter_imm_static_accel_stddev_mps2: 0.20
      world_filter_imm_maneuver_accel_stddev_mps2: 4.0
      world_filter_imm_min_probability: 0.02
      world_filter_imm_turn_rate_stddev_radps2: 0.35
      world_filter_imm_static_persistence: 0.96
      world_filter_imm_cv_persistence: 0.92
      world_filter_imm_turn_persistence: 0.90
      world_filter_imm_max_turn_rate_radps: 1.20
      world_filter_oosm_enabled: true
      world_filter_oosm_window_sec: 0.50
      world_filter_oosm_covariance_inflation: 4.0
      world_filter_pose_history_sec: 2.0
      multi_source_fusion_enabled: true
      multi_source_max_age_sec: 0.50
    profiles:
      fw_metric_pursuit:
        maximum_course_offset: 0.70
        fixed_camera:
          fov_constraint_enabled: false
          preserve_orbit_on_fov_loss: false
          visibility_direction_selection_enabled: false
        predictive_fov:
          enabled: false
        orbit:
          publish_course_rate_feedforward: false
          publish_position_reference: false
        fixed_wing:
          entry_altitude_hold_enabled: false
          entry_altitude_reference_m: -1.0
        target_loss:
          orbit_time_sec: 10.0
          center_hold_enabled: false
          center_hold_time_sec: 0.0
        metric_velocity_estimation:
          enabled: false
          world_filter_enabled: false
          world_filter_model: "cv"
          world_filter_oosm_enabled: false
          multi_source_fusion_enabled: false
      fw_metric_orbit:
        target_loss:
          orbit_time_sec: 35.0

  gmfw_velocity_vector:
    # 云台状态没有实时 FOV 时使用以下标定值；有实时 FOV 时优先使用实时值。
    gimbal_horizontal_fov_rad: 1.0
    gimbal_vertical_fov_rad: 0.75
    # 云台横向偏角减小到此范围内后，逐渐加入图像偏差。
    gimbal_image_alignment_rad: 0.35
    # 图像误差只补充云台视线角；云台角度保持全权重，图像修正权重为 0.30。
    image_error_weight: 0.30
    # 丢框前图像已锁住云台画面中心时，丢框后继续跟随当前云台角度；
    # 超时仍未重获目标则释放参考，由固定翼控制器进入盘旋。
    aligned_loss_coast:
      enabled: true
      duration_sec: 60.0
      max_image_error_x: 0.05     # 归一化图像坐标；约为图像宽度的 2.5%
      max_image_error_y: 0.11     # 归一化图像坐标；约为图像高度的 5.5%
      # 有新鲜测距时，丢框期间按缓存的三维目标点继续引导。
      metric_target_enabled: true
      metric_max_age_sec: 1.0
      metric_max_position_sigma_m: 40.0
      # 下降需求按空速×(目标垂直差/水平距离)计算，距离越近越大；此值只限制最大下降率。
      max_descent_rate_mps: 14.0
      # 进入目标附近后锁住三维点，沿当前引导方向继续下降；期间忽略识别换框。
      terminal_approach_enter_distance_m: 500.0
      # 终端下降目标高度，使用 state_estimator/main/odom 的 ENU Z 坐标（米）。
      # 设成目标区域地面的 Z；不再把测得目标点的 Z 当成下降终点。
      terminal_ground_z_m: -5.0
    pid:
      course:     {kp: 1.3, ki: 0.05, kd: 0.10, integral_limit: 0.35}
      climb_rate: {kp: 35.0, ki: 0.05, kd: 0.10, integral_limit: 0.8}
    airspeed: 30.0
    maximum_course_offset: 0.80
    maximum_climb_rate: 14.0

# 5. 跨模块安全策略 -----------------------------------------------------------
safety:
  # normalized Kalman 位置协方差的标准差比例；不受 640x480/1920x1080 影响。
  uncertainty:
    enabled: true
    nominal_sigma_normalized: 0.05
    slow_ratio: 1.0
    abort_ratio: 2.5
    minimum_scale: 0.25
    yaw_scale: 0.65
  reidentification:
    initial_scale: 0.35
    recovery_sec: 0.60
  profile_switch:
    minimum_interval_sec: 0.50
    blend_duration_sec: 0.50
  gimbal_fallback:
    # GM 姿态失效时：chase -> mc chase，vector -> mc distance。
    enabled: false
  emergency_stop_at_startup: false
